<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Ultimate Cyberpunk Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: #09090b;
            border: 3px solid #facc15;
            padding: 6px 15px;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            color: #facc15;
            box-shadow: 4px 4px 0px #000;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
        }
        #click-prompt {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #facc15;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 100;
            padding: 20px;
        }
        #click-prompt span {
            font-size: 13px;
            color: #a1a1aa;
            margin-top: 12px;
            max-width: 500px;
            line-height: 1.5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #facc15;
            border: 2px solid #000;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            z-index: 25;
            display: none;
        }
        #joystick-handle {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 44px;
            height: 44px;
            background: #facc15;
            border: 2px solid #000;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 2px 2px 0px #000;
        }
        #jump-btn {
            position: absolute;
            bottom: 45px;
            right: 35px;
            width: 75px;
            height: 75px;
            background: #facc15;
            border: 3px solid #000;
            border-radius: 50%;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0px #000;
            z-index: 25;
            cursor: pointer;
        }
        .building-sign {
            position: absolute;
            background: #18181b;
            color: #facc15;
            border: 3px solid #facc15;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            box-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
        }
        .npc-speech {
            position: absolute;
            background: #ffffff;
            color: #09090b;
            border: 2px solid #000;
            padding: 4px 8px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            display: none;
            box-shadow: 2px 2px 0px #000;
            z-index: 20;
        }
        #end-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #09090b;
            border: 6px solid #22c55e;
            padding: 35px;
            text-align: center;
            display: none;
            z-index: 110;
            box-shadow: 8px 8px 0px #000;
            color: #fff;
        }
        #end-screen h1 { margin-top: 0; }
        #end-screen button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #22c55e;
            color: white;
            border: 4px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
    <!-- Three.js Core & Post-processing CDN scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>

    <div id="click-prompt">
        ENTER ULTIMATE RUG VILLE
        <span>[ Features: Unreal Bloom Glow, Jump Mechanics, Chasing Scammer Bots, & Procedural Synthwave Audio ]</span>
    </div>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">ITEMS: 0/4</span>
        <span id="health-text">HP: 100%</span>
    </div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>
    <div id="jump-btn">JUMP</div>
    <div id="speech-overlay"></div>

    <div id="end-screen">
        <h1 id="end-title">LEGENDARY STATUS!</h1>
        <p id="end-desc">You conquered the enhanced realistic boulevard!</p>
        <button onclick="location.reload()">RUN IT BACK</button>
    </div>

    <script>
        // --- WEB AUDIO API SYNTHWAVE SOUNDTRACK & FX ---
        let audioCtx = null;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isAudioInitialized = true;
            startSynthwaveLoop();
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function startSynthwaveLoop() {
            // Simple procedural bassline pulse
            setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                let notes = [110, 110, 130.81, 146.83]; // A minor chord vibe
                let note = notes[Math.floor(Math.random() * notes.length)];
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }, 400);
        }

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050a);
        scene.fog = new THREE.FogExp2(0x05050a, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- POST-PROCESSING BLOOM ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.2,  // strength
            0.4,  // radius
            0.85  // threshold
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x1e1b4b, 1.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xf43f5e, 2.0);
        sunLight.position.set(40, 80, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- ATMOSPHERIC DUST PARTICLES ---
        const particleCount = 500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 80;
            particlePositions[i + 1] = Math.random() * 25;
            particlePositions[i + 2] = (Math.random() - 0.5) * 500;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.35, transparent: true, opacity: 0.7 });
        const dustParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(dustParticles);

        // --- ENVIRONMENT TEXTURES & MESHES ---
        function createDetailedTexture(drawFunction, width = 256, height = 256) {
            let canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            let ctx = canvas.getContext('2d');
            drawFunction(ctx, width, height);
            let texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const roadTex = createDetailedTexture((ctx, w, h) => {
            ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 15000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#18181b' : '#27272a';
                ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
            }
            ctx.fillStyle = '#facc15';
            ctx.fillRect(w/2 - 4, 0, 8, h);
            ctx.fillStyle = '#09090b';
            for (let y = 0; y < h; y += 32) ctx.fillRect(w/2 - 4, y, 8, 16);
        });
        roadTex.repeat.set(1, 120);

        let road = new THREE.Mesh(
            new THREE.PlaneGeometry(24, 700), 
            new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.6, metalness: 0.2 })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.y = -0.99;
        road.receiveShadow = true;
        scene.add(road);

        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.9 });
        let leftSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(16, 700), sidewalkMat);
        leftSidewalk.rotation.x = -Math.PI / 2;
        leftSidewalk.position.set(-20, -0.98, 0);
        leftSidewalk.receiveShadow = true;
        scene.add(leftSidewalk);

        let rightSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(16, 700), sidewalkMat);
        rightSidewalk.rotation.x = -Math.PI / 2;
        rightSidewalk.position.set(20, -0.98, 0);
        rightSidewalk.receiveShadow = true;
        scene.add(rightSidewalk);

        // --- CYBERPUNK BUILDINGS & NEON SIGNS ---
        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        function createCyberShop(x, z, storeName, wallColor, neonColor) {
            let group = new THREE.Group();

            let facade = new THREE.Mesh(
                new THREE.BoxGeometry(20, 28, 18), 
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.3, metalness: 0.4 })
            );
            facade.position.y = 13;
            facade.castShadow = true;
            facade.receiveShadow = true;
            group.add(facade);

            let windowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(12, 10, 0.5), 
                new THREE.MeshStandardMaterial({ color: neonColor, roughness: 0.1, metalness: 0.9, emissive: neonColor, emissiveIntensity: 0.6 })
            );
            windowMesh.position.set(0, 4, 9.1);
            group.add(windowMesh);

            let neonTrim = new THREE.Mesh(
                new THREE.BoxGeometry(21, 1.2, 19), 
                new THREE.MeshStandardMaterial({ color: neonColor, emissive: neonColor, emissiveIntensity: 1.0 })
            );
            neonTrim.position.y = 27.2;
            group.add(neonTrim);

            group.position.set(x, 0, z);
            scene.add(group);

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = storeName;
            speechOverlay.appendChild(signEl);
            buildingSignsData.push({ mesh: group, signElement: signEl, offsetY: 28.5 });
        }

        for (let z = -220; z <= 220; z += 60) {
            createCyberShop(-30, z, "LEVERAGE 1000X", 0x09090b, 0x38bdf8);
            createCyberShop(30, z, "LIQUIDATION HQ", 0x09090b, 0xf43f5e);
        }

        // --- CHASE ENEMIES ("SCAMMER BOTS") & NPC PEDESTRIANS ---
        const entities = [];
        const degenSlang = [
            "100X LONG OPENED 🚀", "LIQUIDATED AGAIN...", "DIAMOND HANDS 💎", 
            "DEV PROMISED NO RUG", "GAS FEES ARE INSANE", "SCAMMER SPOTTED! RUN!"
        ];

        function spawnEntity(x, z, rangeZ, isEnemy) {
            let group = new THREE.Group();
            let bodyColor = isEnemy ? 0xef4444 : 0x22c55e;
            let headColor = isEnemy ? 0x000000 : 0xf97316;

            let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.3, emissive: bodyColor, emissiveIntensity: isEnemy ? 0.5 : 0.0 }));
            torso.position.y = 1.7;
            torso.castShadow = true;
            group.add(torso);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: headColor, roughness: 0.3 }));
            head.position.y = 2.7;
            head.castShadow = true;
            group.add(head);

            group.position.set(x, 0, z);
            scene.add(group);

            let bubble = document.createElement('div');
            bubble.className = 'npc-speech';
            bubble.innerText = isEnemy ? "I AM RUGGING YOU!" : degenSlang[Math.floor(Math.random() * degenSlang.length)];
            speechOverlay.appendChild(bubble);

            entities.push({
                group: group,
                bubble: bubble,
                x: x,
                z: z,
                minZ: z - rangeZ,
                maxZ: z + rangeZ,
                speed: (Math.random() * 3 + 2) * (Math.random() > 0.5 ? 1 : -1),
                isEnemy: isEnemy
            });
        }

        spawnEntity(-16, -80, 50, false);
        spawnEntity(16, -40, 50, true); // Active chasing enemy
        spawnEntity(-16, 30, 50, true);  // Active chasing enemy
        spawnEntity(16, 90, 50, false);

        // --- COLLECTIBLES ---
        let score = 0, collected = 0, health = 100, gameOver = false, gameWon = false;
        const interactiveObjects = [];

        function spawnItem(x, z) {
            let item = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 1.6, 1.6),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.1, metalness: 0.9, emissive: 0xfacc15, emissiveIntensity: 0.8 })
            );
            item.position.set(x, 0.2, z);
            item.userData = { x: x, z: z };
            item.castShadow = true;
            scene.add(item);
            interactiveObjects.push(item);
        }

        spawnItem(-16, -100);
        spawnItem(16, -50);
        spawnItem(-16, 20);
        spawnItem(16, 110);

        // --- PLAYER CONTROLS & PHYSICS ---
        let playerPos = new THREE.Vector3(0, 1.6, 150);
        let playerVelocityY = 0;
        let isJumping = false;
        const gravity = 25.0;
        const jumpForce = 9.0;

        camera.position.copy(playerPos);
        let yaw = 0, pitch = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('jump-btn').style.display = 'flex';
        } else {
            document.getElementById('crosshair').style.display = 'block';
        }

        const clickPrompt = document.getElementById("click-prompt");
        clickPrompt.addEventListener('click', () => {
            initAudio();
            clickPrompt.style.display = 'none';
        });

        let isLooking = false, lastX = 0, lastY = 0;
        window.addEventListener('pointerdown', (e) => {
            if (clickPrompt.style.display !== 'flex' && !isTouchDevice) {
                isLooking = true; lastX = e.clientX; lastY = e.clientY;
            }
        });
        window.addEventListener('pointerup', () => { isLooking = false; });
        window.addEventListener('pointermove', (e) => {
            if (gameOver || gameWon || !isLooking || isTouchDevice) return;
            yaw -= (e.clientX - lastX) * 0.003;
            pitch -= (e.clientY - lastY) * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            lastX = e.clientX; lastY = e.clientY;
        });

        // Touch Joystick Controls
        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let touchId = null, centerPos = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            if (touchId !== null) return;
            let touch = e.changedTouches[0];
            touchId = touch.identifier;
            let rect = joystickZone.getBoundingClientRect();
            centerPos.x = rect.left + rect.width / 2;
            centerPos.y = rect.top + rect.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === touchId) {
                    let dx = touch.clientX - centerPos.x;
                    let dy = touch.clientY - centerPos.y;
                    let dist = Math.hypot(dx, dy), maxDist = 45;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickX = dx / maxDist;
                    joystickY = dy / maxDist;
                }
            }
        });

        joystickZone.addEventListener('touchend', () => {
            touchId = null; joystickX = 0; joystickY = 0;
            joystickHandle.style.transform = `translate(0px, 0px)`;
        });

        function triggerJump() {
            if (!isJumping && playerPos.y <= 1.61) {
                playerVelocityY = jumpForce;
                isJumping = true;
                playSound('jump');
            }
        }

        document.getElementById('jump-btn').addEventListener('click', triggerJump);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            if (e.code === 'Space') triggerJump();
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        // --- MAIN GAME LOOP ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            // Dust Particles Drift
            const positions = dustParticles.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] -= delta * 1.2;
                if (positions[i] < 0) positions[i] = 25;
            }
            dustParticles.geometry.attributes.position.needsUpdate = true;

            if (!gameOver && !gameWon) {
                if (Math.abs(joystickX) > 0.1) yaw -= joystickX * 2.5 * delta;

                let speed = 11.0 * delta;
                let dir = new THREE.Vector3();
                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;
                if (Math.abs(joystickY) > 0.1) dir.z += joystickY;

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    playerPos.x += dir.x * speed;
                    playerPos.z += dir.z * speed;
                }

                // Gravity & Jumping Physics
                playerVelocityY -= gravity * delta;
                playerPos.y += playerVelocityY * delta;
                if (playerPos.y < 1.6) {
                    playerPos.y = 1.6;
                    playerVelocityY = 0;
                    isJumping = false;
                }

                playerPos.x = Math.max(-18, Math.min(18, playerPos.x));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.copy(playerPos);

                // Entity Movement & Chasing AI
                entities.forEach(ent => {
                    if (ent.isEnemy) {
                        // Chase player if close
                        let dx = playerPos.x - ent.group.position.x;
                        let dz = playerPos.z - ent.group.position.z;
                        let distToPlayer = Math.hypot(dx, dz);
                        if (distToPlayer < 25) {
                            ent.group.position.x += (dx / distToPlayer) * 4.5 * delta;
                            ent.group.position.z += (dz / distToPlayer) * 4.5 * delta;
                            if (distToPlayer < 1.8) {
                                health -= 25;
                                playSound('hurt');
                                document.getElementById("health-text").innerText = `HP: ${health}%`;
                                ent.group.position.z += 10; // Knockback enemy
                                if (health <= 0) {
                                    gameOver = true;
                                    document.getElementById("end-title").innerText = "LIQUIDATED!";
                                    document.getElementById("end-title").style.color = "#ef4444";
                                    document.getElementById("end-desc").innerText = "Scammer bots caught your portfolio.";
                                    document.getElementById("end-screen").style.display = "block";
                                }
                            }
                        } else {
                            ent.z += ent.speed * delta;
                            if (ent.z > ent.maxZ || ent.z < ent.minZ) ent.speed *= -1;
                            ent.group.position.z = ent.z;
                        }
                    } else {
                        ent.z += ent.speed * delta;
                        if (ent.z > ent.maxZ || ent.z < ent.minZ) ent.speed *= -1;
                        ent.group.position.z = ent.z;
                    }

                    let vector = new THREE.Vector3(ent.group.position.x, 3.2, ent.group.position.z).project(camera);
                    let dist = camera.position.distanceTo(ent.group.position);
                    if (vector.z < 1 && dist < 50) {
                        ent.bubble.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        ent.bubble.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        ent.bubble.style.display = 'block';
                    } else {
                        ent.bubble.style.display = 'none';
                    }
                });

                // Building Signs Projection
                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 70) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else {
                        b.signElement.style.display = 'none';
                    }
                });

                // Collectible Interaction
                interactiveObjects.forEach((obj, index) => {
                    obj.rotation.y += 2.0 * delta;
                    if (Math.hypot(playerPos.x - obj.userData.x, playerPos.z - obj.userData.z) < 1.8) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 1000;
                        collected++;
                        playSound('coin');
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `ITEMS: ${collected}/4`;
                        if (collected >= 4) {
                            gameWon = true;
                            document.getElementById("end-title").innerText = "LEGENDARY STATUS!";
                            document.getElementById("end-title").style.color = "#22c55e";
                            document.getElementById("end-desc").innerText = "You successfully raided Rug Ville and secured the bag!";
                            document.getElementById("end-screen").style.display = "block";
                        }
                    }
                });
            }

            composer.render();
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
