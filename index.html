<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Ultimate Next-Gen Retro Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #09090b;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: #09090b;
            border: 3px solid #facc15;
            padding: 6px 15px;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            color: #facc15;
            box-shadow: 4px 4px 0px #000;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
        }
        #click-prompt {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #facc15;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 100;
            padding: 20px;
        }
        #click-prompt span {
            font-size: 13px;
            color: #a1a1aa;
            margin-top: 12px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #facc15;
            border: 2px solid #000;
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        /* CRT Scanlines Overlay */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
        }
        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            z-index: 25;
            display: none;
        }
        #joystick-handle {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 44px;
            height: 44px;
            background: #facc15;
            border: 2px solid #000;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 2px 2px 0px #000;
        }
        .building-sign {
            position: absolute;
            background: #18181b;
            color: #facc15;
            border: 3px solid #facc15;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            box-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
        }
        .npc-speech {
            position: absolute;
            background: #ffffff;
            color: #09090b;
            border: 2px solid #000;
            padding: 4px 8px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            display: none;
            box-shadow: 2px 2px 0px #000;
            z-index: 20;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #09090b;
            border: 6px solid #22c55e;
            padding: 35px;
            text-align: center;
            display: none;
            z-index: 110;
            box-shadow: 8px 8px 0px #000;
            color: #fff;
        }
        #win-screen h1 { color: #22c55e; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #22c55e;
            color: white;
            border: 4px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="click-prompt">
        ENTER ULTIMATE RUG VILLE
        <span>[ True 3D Voxel Characters, Dynamic Neon Shaders, & CRT Arcade Overlays ]</span>
    </div>

    <div id="crt-overlay"></div>
    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">ITEMS: 0/4</span>
    </div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>
    <div id="speech-overlay"></div>

    <div id="win-screen">
        <h1>LEGENDARY STATUS!</h1>
        <p>You conquered the ultimate dgen boulevard!</p>
        <button onclick="location.reload()">RUN IT BACK</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.6);
        scene.add(ambientLight);

        // Moody night-time street lighting with glowing point sources
        const streetLight = new THREE.DirectionalLight(0xf43f5e, 0.8);
        streetLight.position.set(30, 80, 30);
        streetLight.castShadow = true;
        scene.add(streetLight);

        // --- HIGH-END PROCEDURAL TEXTURES ---
        function createPixelTexture(drawFunction, width = 128, height = 128) {
            let canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            let ctx = canvas.getContext('2d');
            drawFunction(ctx, width, height);
            let texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const roadTex = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#18181b'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#27272a';
            for (let y = 0; y < h; y += 8) {
                for (let x = (y/8)%2 === 0 ? 0 : 8; x < w; x += 16) {
                    ctx.fillRect(x, y, 14, 6);
                }
            }
            // Neon glowing cyberpunk striping down center road
            ctx.fillStyle = '#ec4899';
            ctx.fillRect(w/2 - 3, 0, 6, h);
            ctx.fillStyle = '#18181b';
            for (let y = 0; y < h; y += 24) ctx.fillRect(w/2 - 3, y, 6, 12);
        }, 128, 128);
        roadTex.repeat.set(1, 120);

        const neonBrickTex = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#2b1b3d'; // Deep cyber brick base
            for (let y = 0; y < h; y += 16) {
                ctx.fillRect(0, y, w, 2);
                let offset = (y / 16) % 2 === 0 ? 0 : 16;
                for (let x = offset; x < w; x += 32) ctx.fillRect(x, y, 2, 16);
            }
        }, 128, 128);
        neonBrickTex.repeat.set(4, 5);

        // --- ENVIRONMENT SETUP ---
        let road = new THREE.Mesh(new THREE.PlaneGeometry(22, 600), new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.5 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = -0.99;
        road.receiveShadow = true;
        scene.add(road);

        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.9 });
        let leftSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(14, 600), sidewalkMat);
        leftSidewalk.rotation.x = -Math.PI / 2;
        leftSidewalk.position.set(-18, -0.98, 0);
        leftSidewalk.receiveShadow = true;
        scene.add(leftSidewalk);

        let rightSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(14, 600), sidewalkMat);
        rightSidewalk.rotation.x = -Math.PI / 2;
        rightSidewalk.position.set(18, -0.98, 0);
        rightSidewalk.receiveShadow = true;
        scene.add(rightSidewalk);

        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        // Masterpiece Cyber-Storefronts with Glowing Neon Trim
        function createCyberShop(x, z, storeName, wallColor) {
            let group = new THREE.Group();

            let facade = new THREE.Mesh(
                new THREE.BoxGeometry(18, 24, 16), 
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.3, metalness: 0.2 })
            );
            facade.position.y = 11;
            facade.castShadow = true;
            facade.receiveShadow = true;
            group.add(facade);

            // Glowing Cyber Window
            let windowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(10, 10, 0.5), 
                new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
            );
            windowMesh.position.set(0, 4, 8.1);
            group.add(windowMesh);

            // Bright Neon Roof Trim
            let neonTrim = new THREE.Mesh(
                new THREE.BoxGeometry(19, 1.2, 17), 
                new THREE.MeshBasicMaterial({ color: 0xf43f5e })
            );
            neonTrim.position.y = 23.4;
            group.add(neonTrim);

            group.position.set(x, 0, z);
            scene.add(group);

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = storeName;
            speechOverlay.appendChild(signEl);
            buildingSignsData.push({ mesh: group, signElement: signEl, offsetY: 24.5 });
        }

        for (let z = -180; z <= 180; z += 60) {
            createCyberShop(-28, z, "LEVERAGE 100X", 0x18181b);
            createCyberShop(28, z, "LIQUIDATION HQ", 0x18181b);
        }

        // --- TRUE 3D VOXEL CHARACTERS ---
        const pedestrians = [];
        const degenSlang = [
            "100X LONG OPENED 🚀", "LIQUIDATED AGAIN...", "DIAMOND HANDS 💎", 
            "DEV PROMISED NO RUG", "GAS FEES ARE INSANE", "SEND IT TO VALHALLA"
        ];

        function createTrue3DVoxelNPC(x, z, rangeZ) {
            let npcGroup = new THREE.Group();

            // Voxel Body Blocks
            let bodyMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.4 });
            let headMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4 });
            let legMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.6 });

            let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), bodyMat);
            torso.position.y = 1.7;
            torso.castShadow = true;
            npcGroup.add(torso);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), headMat);
            head.position.y = 2.7;
            head.castShadow = true;
            npcGroup.add(head);

            let leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), legMat);
            leftLeg.position.set(-0.3, 0.6, 0);
            npcGroup.add(leftLeg);

            let rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), legMat);
            rightLeg.position.set(0.3, 0.6, 0);
            npcGroup.add(rightLeg);

            npcGroup.position.set(x, 0, z);
            scene.add(npcGroup);

            let bubble = document.createElement('div');
            bubble.className = 'npc-speech';
            bubble.innerText = degenSlang[Math.floor(Math.random() * degenSlang.length)];
            speechOverlay.appendChild(bubble);

            setInterval(() => {
                bubble.innerText = degenSlang[Math.floor(Math.random() * degenSlang.length)];
            }, 3000 + Math.random() * 3000);

            pedestrians.push({
                group: npcGroup,
                bubble: bubble,
                x: x,
                z: z,
                minZ: z - rangeZ,
                maxZ: z + rangeZ,
                speed: (Math.random() * 2.5 + 1.5) * (Math.random() > 0.5 ? 1 : -1)
            });
        }

        createTrue3DVoxelNPC(-16, -70, 45);
        createTrue3DVoxelNPC(16, -20, 45);
        createTrue3DVoxelNPC(-16, 50, 50);
        createTrue3DVoxelNPC(16, 90, 50);

        // --- COLLECTIBLES ---
        let score = 0, collected = 0, gameWon = false;
        const interactiveObjects = [];

        function spawnItem(x, z) {
            let item = new THREE.Mesh(
                new THREE.BoxGeometry(1.6, 1.6, 1.6),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.1, metalness: 0.9, emissive: 0xca8a04, emissiveIntensity: 0.4 })
            );
            item.position.set(x, -0.1, z);
            item.userData = { x: x, z: z };
            item.castShadow = true;
            scene.add(item);
            interactiveObjects.push(item);
        }

        spawnItem(-16, -50);
        spawnItem(16, -10);
        spawnItem(-16, 40);
        spawnItem(16, 80);

        // --- CONTROLS & CAMERA STATE ---
        let playerPos = new THREE.Vector3(0, 1.6, 130);
        camera.position.copy(playerPos);
        let yaw = 0, pitch = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
        } else {
            document.getElementById('crosshair').style.display = 'block';
        }

        const clickPrompt = document.getElementById("click-prompt");
        clickPrompt.addEventListener('click', () => {
            clickPrompt.style.display = 'none';
        });

        // Desktop Look Support
        let isLooking = false, lastX = 0, lastY = 0;
        window.addEventListener('pointerdown', (e) => {
            if (clickPrompt.style.display !== 'flex' && !isTouchDevice) {
                isLooking = true; lastX = e.clientX; lastY = e.clientY;
            }
        });
        window.addEventListener('pointerup', () => { isLooking = false; });
        window.addEventListener('pointermove', (e) => {
            if (gameWon || !isLooking || isTouchDevice) return;
            yaw -= (e.clientX - lastX) * 0.003;
            pitch -= (e.clientY - lastY) * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            lastX = e.clientX; lastY = e.clientY;
        });

        // Joystick Controls (Steering + Turning)
        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let touchId = null, centerPos = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            if (touchId !== null) return;
            let touch = e.changedTouches[0];
            touchId = touch.identifier;
            let rect = joystickZone.getBoundingClientRect();
            centerPos.x = rect.left + rect.width / 2;
            centerPos.y = rect.top + rect.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === touchId) {
                    let dx = touch.clientX - centerPos.x;
                    let dy = touch.clientY - centerPos.y;
                    let dist = Math.hypot(dx, dy), maxDist = 45;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickX = dx / maxDist;
                    joystickY = dy / maxDist;
                }
            }
        });

        joystickZone.addEventListener('touchend', () => {
            touchId = null; joystickX = 0; joystickY = 0;
            joystickHandle.style.transform = `translate(0px, 0px)`;
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                if (Math.abs(joystickX) > 0.1) {
                    yaw -= joystickX * 2.4 * delta;
                }

                let speed = 9.5 * delta;
                let dir = new THREE.Vector3();
                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                if (Math.abs(joystickY) > 0.1) dir.z += joystickY;

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    playerPos.x += dir.x * speed;
                    playerPos.z += dir.z * speed;
                }

                playerPos.x = Math.max(-16, Math.min(16, playerPos.x));
                playerPos.y = 1.6;

                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.copy(playerPos);

                // Animate Voxel NPCs & Speech Bubbles
                pedestrians.forEach(npc => {
                    npc.z += npc.speed * delta;
                    if (npc.z > npc.maxZ || npc.z < npc.minZ) npc.speed *= -1;
                    npc.group.position.z = npc.z;

                    let vector = new THREE.Vector3(npc.x, 3.2, npc.z).project(camera);
                    let dist = camera.position.distanceTo(npc.group.position);
                    if (vector.z < 1 && dist < 50) {
                        npc.bubble.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        npc.bubble.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        npc.bubble.style.display = 'block';
                    } else {
                        npc.bubble.style.display = 'none';
                    }
                });

                // Render Building Signs
                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 70) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else {
                        b.signElement.style.display = 'none';
                    }
                });

                // Item Collection Check
                interactiveObjects.forEach((obj, index) => {
                    if (Math.hypot(playerPos.x - obj.userData.x, playerPos.z - obj.userData.z) < 1.6) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 500;
                        collected++;
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `ITEMS: ${collected}/4`;
                        if (collected >= 4) {
                            gameWon = true;
                            document.getElementById("win-screen").style.display = "block";
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
