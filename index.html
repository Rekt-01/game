<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Next-Gen Enhanced Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 2s;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border: 2px solid #38bdf8;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            font-size: 12px;
            color: #e2e8f0;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            white-space: nowrap;
        }
        #alert-banner {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.95);
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            display: none;
            z-index: 15;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.4);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.05); }
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #speech-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
            overflow: hidden;
        }
        .speech-bubble {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(4px);
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #f8fafc;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
        }
        .building-sign {
            position: absolute;
            background: #0f172a;
            color: #facc15;
            border: 2px solid #facc15;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            text-transform: uppercase;
        }
        #joystick-zone {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 15;
            touch-action: none;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #joystick-handle {
            position: absolute;
            top: 42px;
            left: 42px;
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #22c55e;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            display: none;
            z-index: 25;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            color: #fff;
        }
        #win-screen h1 { color: #22c55e; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
        #win-screen button:hover { background: #16a34a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">RUG VILLE CASH: $0</span>
        <span id="package-text">PACKAGES: 0/4</span>
    </div>
    <div id="alert-banner">🚨 MARKET CRASH: RUG PULL IMMINENT! 🚨</div>
    <div id="speech-overlay"></div>
    <div id="instructions">PC: Click to look &amp; WASD | Mobile: Drag Joystick to Move &amp; Turn</div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>

    <div id="win-screen">
        <h1>RUG VILLE SAVED!</h1>
        <p>You survived the crash and delivered everything!</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            alert('Failed to load Three.js library.');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Enhanced Cinematic Lighting Setup
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffedd5, 1.8);
        sunLight.position.set(60, 120, 60);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        let d = 120;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        let timeOfDay = 0;

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Enhanced Roads with Curbs & Markings
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.6 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const curbMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5 });

        function createRoad(x, z, width, length, rotation = 0) {
            let roadGroup = new THREE.Group();
            let road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            roadGroup.add(road);

            let curbLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, length), curbMat);
            curbLeft.position.set(-width/2 - 0.2, -1.13, 0);
            curbLeft.castShadow = true;
            curbLeft.receiveShadow = true;
            roadGroup.add(curbLeft);

            let curbRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, length), curbMat);
            curbRight.position.set(width/2 + 0.2, -1.13, 0);
            curbRight.castShadow = true;
            curbRight.receiveShadow = true;
            roadGroup.add(curbRight);

            for (let i = -length / 2 + 3; i < length / 2; i += 6) {
                let line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.01;
                if (rotation === 0) line.position.z = i;
                else line.position.x = i;
                roadGroup.add(line);
            }
            roadGroup.position.set(x, -1.18, z);
            roadGroup.rotation.y = rotation;
            scene.add(roadGroup);
        }

        createRoad(0, 0, 16, 400, 0);
        createRoad(0, 0, 400, 16, Math.PI / 2);
        createRoad(0, -120, 16, 400, 0);
        createRoad(-120, 0, 400, 16, Math.PI / 2);

        // Modern Glass & Concrete Buildings
        const solidColliders = [];
        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        const buildingNames = [
            "Rug Casino", "Rug Shop", "Rug Hotel", "Rug Bank", 
            "Scam Exchange", "Pump & Dump HQ", "Liquidity Drain", "Zero Floor Cafe"
        ];

        function createBuilding(x, z, width, height, depth, wallColor, signText) {
            let group = new THREE.Group();
            
            let walls = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.4, metalness: 0.2 })
            );
            walls.position.y = height / 2 - 1.18;
            walls.castShadow = true;
            walls.receiveShadow = true;
            group.add(walls);

            let glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.1, metalness: 0.8, emissive: 0x0369a1, emissiveIntensity: 0.2 });
            let windowPanel = new THREE.Mesh(new THREE.BoxGeometry(width + 0.1, height * 0.7, depth + 0.1), glassMat);
            windowPanel.position.y = height / 2 - 1.18;
            group.add(windowPanel);

            let roof = new THREE.Mesh(
                new THREE.BoxGeometry(width + 0.6, 0.8, depth + 0.6),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 })
            );
            roof.position.y = height - 0.7;
            roof.castShadow = true;
            group.add(roof);

            group.position.set(x, 0, z);
            scene.add(group);
            solidColliders.push({ x: x, z: z, sizeX: width + 0.6, sizeZ: depth + 0.6 });

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = signText;
            speechOverlay.appendChild(signEl);

            buildingSignsData.push({
                mesh: group,
                signElement: signEl,
                offsetY: height + 0.8
            });
        }

        const bColors = [0x334155, 0x475569, 0x1e293b, 0x334155];
        let nameIdx = 0;
        for (let xPos of [-70, -35, 35, 70]) {
            for (let zPos of [-70, -35, 35, 70]) {
                createBuilding(xPos, zPos, 14, 11, 14, bColors[Math.floor(Math.random()*bColors.length)], buildingNames[nameIdx % buildingNames.length]);
                nameIdx++;
            }
        }

        // --- TRAFFIC SYSTEM ---
        const activeVehicles = [];

        function createVehicle(x, z, color, isBus = false, axis = 'z', minBound = -150, maxBound = 150, speed = 12) {
            let carGroup = new THREE.Group();
            let w = isBus ? 2.4 : 1.8;
            let l = isBus ? 6.5 : 3.8;
            let h = isBus ? 2.6 : 1.4;

            let body = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, l),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.6 })
            );
            body.position.y = h / 2 - 0.7;
            body.castShadow = true;
            carGroup.add(body);

            carGroup.position.set(x, 0, z);
            if (axis === 'x') carGroup.rotation.y = (speed > 0) ? Math.PI / 2 : -Math.PI / 2;
            else carGroup.rotation.y = (speed > 0) ? 0 : Math.PI;

            scene.add(carGroup);

            activeVehicles.push({
                mesh: carGroup,
                axis: axis,
                pos: (axis === 'z') ? z : x,
                min: minBound,
                max: maxBound,
                speed: speed
            });
        }

        createVehicle(4, -150, 0xdc2626, false, 'z', -160, 160, 12);
        createVehicle(-4, 150, 0x2563eb, false, 'z', -160, 160, -14);
        createVehicle(150, 4, 0xf59e0b, true, 'x', -160, 160, 10);
        createVehicle(-150, -4, 0xf8fafc, true, 'x', -160, 160, -11);

        // --- CITIZENS (Upgraded with Cyber Aesthetic) ---
        const activeCitizens = [];
        const degenQuotes = [
            "Dev dumped the floor! Rugged again!",
            "Bro I'm down 90% on memecoins",
            "Wen moon ser? This project is cooked",
            "Working overtime just to buy the dip",
            "Touching grass is bullish",
            "Paper hands everywhere in Rug Ville",
            "SEC is auditing the liquidity pool!"
        ];

        function createRealisticPerson(x, z, shirtColor, isWorker = false, isPolice = false) {
            let personGroup = new THREE.Group();

            let skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0b1, roughness: 0.7 });
            let cyberSkinMat = new THREE.MeshStandardMaterial({ 
                color: 0x38bdf8, 
                roughness: 0.2, 
                metalness: 0.8, 
                emissive: 0x0284c7, 
                emissiveIntensity: 0.5 
            });
            
            let outfitColor = isPolice ? 0x1e3a8a : shirtColor;
            let outfitMat = new THREE.MeshStandardMaterial({ color: outfitColor, roughness: 0.7 });
            let pantsMat = new THREE.MeshStandardMaterial({ color: isPolice ? 0x0f172a : 0x1e3a8a, roughness: 0.8 });

            // Torso
            let torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.8, 0.3), outfitMat);
            torso.position.y = -0.2;
            torso.castShadow = true;
            personGroup.add(torso);

            // Head & Cyber Jaw Implant
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), skinMat);
            head.position.y = 0.35;
            head.castShadow = true;
            personGroup.add(head);

            let cyberJaw = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.25), cyberSkinMat);
            cyberJaw.position.set(0.12, 0.28, 0.05);
            personGroup.add(cyberJaw);

            // Glowing Cyber Goggles / Visor
            let visorMat = new THREE.MeshStandardMaterial({ 
                color: 0x10b981, 
                roughness: 0.1, 
                metalness: 0.9, 
                emissive: 0x059669, 
                emissiveIntensity: 0.8 
            });
            let visor = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.28), visorMat);
            visor.position.set(0, 0.38, 0.1);
            personGroup.add(visor);

            // Backward Green Cap
            let capMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 });
            let capDome = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
            capDome.position.y = 0.45;
            personGroup.add(capDome);

            let capBill = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.04, 0.2), capMat);
            capBill.position.set(0, 0.48, -0.15);
            personGroup.add(capBill);

            // Arms & Legs
            let armGeo = new THREE.BoxGeometry(0.16, 0.7, 0.18);
            let leftArm = new THREE.Mesh(armGeo, outfitMat);
            leftArm.position.set(-0.38, -0.2, 0);
            let rightArm = new THREE.Mesh(armGeo, outfitMat);
            rightArm.position.set(0.38, -0.2, 0);
            personGroup.add(leftArm);
            personGroup.add(rightArm);

            let legGeo = new THREE.BoxGeometry(0.2, 0.75, 0.2);
            let leftLeg = new THREE.Mesh(legGeo, pantsMat);
            leftLeg.position.set(-0.15, -0.85, 0);
            let rightLeg = new THREE.Mesh(legGeo, pantsMat);
            rightLeg.position.set(0.15, -0.85, 0);
            personGroup.add(leftLeg);
            personGroup.add(rightLeg);

            personGroup.position.set(x, 0, z);
            scene.add(personGroup);

            let bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            bubble.innerText = isPolice ? "SEC Agent: Show me your crypto license!" : degenQuotes[Math.floor(Math.random() * degenQuotes.length)];
            speechOverlay.appendChild(bubble);

            activeCitizens.push({
                mesh: personGroup,
                leftArm: leftArm, rightArm: rightArm, leftLeg: leftLeg, rightLeg: rightLeg,
                x: x, z: z, originX: x, originZ: z,
                angle: Math.random() * Math.PI * 2,
                speed: isPolice ? 0.8 : (0.4 + Math.random() * 0.4),
                isPolice: isPolice,
                bubble: bubble,
                timer: Math.random() * 10
            });
        }

        const colors = [0xef4444, 0x3b82f6, 0x10b981, 0xa855f7, 0xf97316];
        for (let i = 0; i < 10; i++) {
            createRealisticPerson((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, colors[Math.floor(Math.random()*colors.length)]);
        }
        createRealisticPerson(20, 20, 0, false, true);

        // Trees
        function createTree(x, z) {
            let treeGroup = new THREE.Group();
            let trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.6, 3.5, 8),
                new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.9 })
            );
            trunk.position.y = 0.8;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            let leaves = new THREE.Mesh(
                new THREE.DodecahedronGeometry(2.5),
                new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.8 })
            );
            leaves.position.y = 3.5;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, -1.18, z);
            scene.add(treeGroup);
            solidColliders.push({ x: x, z: z, sizeX: 1.2, sizeZ: 1.2 });
        }

        for (let i = -140; i <= 140; i += 35) {
            if (Math.abs(i) > 20) {
                createTree(i, -22);
                createTree(i, 22);
            }
        }

        // Collectibles & Exit
        let score = 0;
        let packagesCollected = 0;
        const totalPackages = 4;
        let gameWon = false;
        const interactiveObjects = [];

        function createPackage(x, z, isDip = false) {
            let pkg = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.2, 1.2),
                new THREE.MeshStandardMaterial({ color: isDip ? 0xfacc15 : 0xef4444, roughness: 0.2, metalness: 0.4 })
            );
            pkg.position.set(x, -0.5, z);
            pkg.castShadow = true;
            pkg.userData = { type: 'package', x: x, z: z, isDip: isDip };
            scene.add(pkg);
            interactiveObjects.push(pkg);
        }

        createPackage(-50, -50);
        createPackage(50, -50);
        createPackage(-50, 50);
        createPackage(60, 60);

        let exitZone = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.1, 6),
            new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, roughness: 0.2 })
        );
        exitZone.position.set(0, -1.15, -90);
        scene.add(exitZone);

        camera.position.set(0, 0, 80);

        let rugPullTimer = 0;
        let rugPullActive = false;
        let yaw = 0, pitch = 0;
        const playerRadius = 0.5;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        renderer.domElement.addEventListener('click', () => {
            if (!('ontouchstart' in window) && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body || gameWon) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            let joystickZone = document.getElementById('joystick-zone');
            let joystickHandle = document.getElementById('joystick-handle');
            let touchId = null, centerPos = { x: 0, y: 0 };

            joystickZone.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                let touch = e.changedTouches[0];
                touchId = touch.identifier;
                let rect = joystickZone.getBoundingClientRect();
                centerPos.x = rect.left + rect.width / 2;
                centerPos.y = rect.top + rect.height / 2;
            });

            joystickZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let dx = touch.clientX - centerPos.x;
                        let dy = touch.clientY - centerPos.y;
                        let dist = Math.hypot(dx, dy), maxDist = 45;
                        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                        joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickX = dx / maxDist;
                        joystickY = dy / maxDist;
                    }
                }
            });

            let endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null; joystickX = 0; joystickY = 0;
                        joystickHandle.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            joystickZone.addEventListener('touchend', endTouch);
        }

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let halfX = obj.sizeX / 2, halfZ = obj.sizeZ / 2;
                if (x + playerRadius > obj.x - halfX && x - playerRadius < obj.x + halfX && z + playerRadius > obj.z - halfZ && z - playerRadius < obj.z + halfZ) {
                    return true;
                }
            }
            return false;
        }

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                let speed = 8.5 * delta;
                let dir = new THREE.Vector3();
                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                if (isTouchDevice) {
                    if (Math.abs(joystickX) > 0.1) yaw -= joystickX * 2.2 * delta;
                    if (Math.abs(joystickY) > 0.1) dir.z += joystickY;
                }

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    let nextX = camera.position.x + dir.x * speed;
                    let nextZ = camera.position.z + dir.z * speed;
                    if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                    if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
                }

                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.y = 0;

                timeOfDay += delta * 0.05;
                let cycle = Math.sin(timeOfDay);
                sunLight.intensity = Math.max(0.2, cycle * 1.8);

                rugPullTimer += delta;
                if (rugPullTimer > 25 && !rugPullActive) {
                    rugPullActive = true;
                    document.getElementById("alert-banner").style.display = "block";
                    createPackage((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, true);
                    setTimeout(() => {
                        document.getElementById("alert-banner").style.display = "none";
                        rugPullActive = false;
                        rugPullTimer = 0;
                    }, 6000);
                }

                activeVehicles.forEach(v => {
                    v.pos += v.speed * delta;
                    if (v.pos > v.max) v.pos = v.min;
                    if (v.pos < v.min) v.pos = v.max;
                    if (v.axis === 'z') v.mesh.position.z = v.pos;
                    else v.mesh.position.x = v.pos;
                });

                activeCitizens.forEach(c => {
                    let moveMultiplier = c.isPolice ? 1.2 : 1.0;
                    c.angle += delta * c.speed * moveMultiplier;
                    c.x = c.originX + Math.sin(c.angle) * 6;
                    c.z = c.originZ + Math.cos(c.angle) * 6;
                    c.mesh.position.set(c.x, 0, c.z);

                    let swing = Math.sin(time * 0.005 * c.speed * 10) * 0.4;
                    c.leftLeg.rotation.x = swing;
                    c.rightLeg.rotation.x = -swing;
                    c.leftArm.rotation.x = -swing;
                    c.rightArm.rotation.x = swing;

                    c.timer += delta;
                    if (c.timer > 6) {
                        c.timer = 0;
                        if (!c.isPolice) {
                            c.bubble.innerText = degenQuotes[Math.floor(Math.random() * degenQuotes.length)];
                        }
                    }

                    let vector = new THREE.Vector3(c.x, 1.2, c.z).project(camera);
                    let dist = camera.position.distanceTo(c.mesh.position);
                    if (vector.z < 1 && dist < 30) {
                        c.bubble.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        c.bubble.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        c.bubble.style.display = 'block';
                    } else {
                        c.bubble.style.display = 'none';
                    }
                });

                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 60) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else {
                        b.signElement.style.display = 'none';
                    }
                });

                interactiveObjects.forEach((obj, index) => {
                    if (Math.hypot(camera.position.x - obj.userData.x, camera.position.z - obj.userData.z) < 1.8) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += obj.userData.isDip ? 1500 : 500;
                        if (!obj.userData.isDip) packagesCollected++;
                        document.getElementById("score-text").innerText = `RUG VILLE CASH: $${score}`;
                        document.getElementById("package-text").innerText = `PACKAGES: ${packagesCollected}/${totalPackages}`;
                    }
                });

                if (Math.hypot(camera.position.x - exitZone.position.x, camera.position.z - exitZone.position.z) < 4 && packagesCollected >= totalPackages) {
                    gameWon = true;
                    if (document.pointerLockElement) document.exitPointerLock();
                    document.getElementById("win-screen").style.display = "block";
                }
            }

            interactiveObjects.forEach(obj => obj.rotation.y += 0.02);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
