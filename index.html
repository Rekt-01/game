<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open World - GTA Style</title>
    <style>
        body {
            margin: 0;
            background-color: #78b1f5;
            color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 28px;
            border: 2px solid #2563eb;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            color: #1d4ed8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid #2563eb;
            font-size: 13px;
            color: #334155;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #22c55e;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            display: none;
            z-index: 20;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        #win-screen h1 { color: #16a34a; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
            transition: background 0.2s;
        }
        #win-screen button:hover { background: #16a34a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">PACKAGES: 0/4</span>
    </div>
    <div id="instructions">Click to explore open world &bull; Use <b>W, A, S, D</b> to walk anywhere</div>
    <div id="win-screen">
        <h1>MISSION PASSED!</h1>
        <p>All packages secured across the district!</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            alert('Failed to load Three.js library.');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Bright Daytime Environment Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 300;
        let d = 80;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Infinite Grass Terrain Ground Plane
        const groundGeo = new THREE.PlaneGeometry(800, 800);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- GENERATE ROADS ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

        function createRoad(x, z, width, length, rotation = 0) {
            let roadGroup = new THREE.Group();
            let road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            roadGroup.add(road);

            // Yellow center dashes
            for (let i = -length / 2 + 3; i < length / 2; i += 6) {
                let line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.01;
                if (rotation === 0) line.position.z = i;
                else line.position.x = i;
                roadGroup.add(line);
            }

            roadGroup.position.set(x, -1.18, z);
            roadGroup.rotation.y = rotation;
            scene.add(roadGroup);
        }

        // Main Grid Roads
        createRoad(0, 0, 14, 300, 0);
        createRoad(0, 0, 300, 14, Math.PI / 2);
        createRoad(0, -90, 14, 300, 0);
        createRoad(-90, 0, 300, 14, Math.PI / 2);

        // --- GENERATE REALISTIC HOUSES / BUILDINGS ---
        const solidColliders = [];

        function createHouse(x, z, width, height, depth, wallColor, roofColor) {
            let houseGroup = new THREE.Group();

            // Main Walls
            let walls = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.6 })
            );
            walls.position.y = height / 2 - 1.18;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            // Roof
            let roof = new THREE.Mesh(
                new THREE.ConeGeometry(Math.max(width, depth) * 0.75, 3, 4),
                new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5 })
            );
            roof.position.y = height + 0.35;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // Door
            let door = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 2.2, 0.2),
                new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 })
            );
            door.position.set(0, 0, depth / 2 + 0.05);
            houseGroup.add(door);

            houseGroup.position.set(x, 0, z);
            scene.add(houseGroup);

            solidColliders.push({ x: x, z: z, sizeX: width + 0.6, sizeZ: depth + 0.6 });
        }

        // Neighborhood layout (placing houses safely away from road bounds)
        const houseColors = [0xf8fafc, 0xf1f5f9, 0xe2e8f0, 0xdcbdab, 0xc27803];
        const roofColors = [0x991b1b, 0x1e3a8a, 0x14532d, 0x334155, 0x78350f];

        for (let xPos of [-55, -25, 25, 55]) {
            for (let zPos of [-55, -25, 25, 55]) {
                let wColor = houseColors[Math.floor(Math.random() * houseColors.length)];
                let rColor = roofColors[Math.floor(Math.random() * roofColors.length)];
                createHouse(xPos, zPos, 12, 7, 12, wColor, rColor);
            }
        }

        // --- GENERATE TREES ---
        function createTree(x, z) {
            let treeGroup = new THREE.Group();

            let trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 })
            );
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            let leaves = new THREE.Mesh(
                new THREE.DodecahedronGeometry(3),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 })
            );
            leaves.position.y = 4.5;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, -1.18, z);
            scene.add(treeGroup);
            solidColliders.push({ x: x, z: z, sizeX: 1.2, sizeZ: 1.2 });
        }

        // Scatter trees along blocks
        for (let i = -120; i <= 120; i += 30) {
            if (Math.abs(i) > 15) {
                createTree(i, -18);
                createTree(i, 18);
                createTree(-18, i);
                createTree(18, i);
            }
        }

        // --- COLLECTIBLES & OBJECTS ---
        let score = 0;
        let packagesCollected = 0;
        const totalPackages = 4;
        let gameWon = false;
        const interactiveObjects = [];

        function createPackage(x, z) {
            let pkg = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.2, 1.2),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.2 })
            );
            pkg.position.set(x, -0.5, z);
            pkg.castShadow = true;
            pkg.userData = { type: 'package', x: x, z: z };
            scene.add(pkg);
            interactiveObjects.push(pkg);
        }

        createPackage(-40, -40);
        createPackage(40, -40);
        createPackage(-40, 40);
        createPackage(50, 50);

        // Delivery / Exit Zone
        let exitZone = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.1, 6),
            new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, roughness: 0.2 })
        );
        exitZone.position.set(0, -1.15, -70);
        scene.add(exitZone);

        // Start Position (Middle of road intersection, safe area)
        camera.position.set(0, 0, 70);

        // Controls State
        let yaw = 0;
        let pitch = 0;
        const playerRadius = 0.5;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body || gameWon) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let halfX = obj.sizeX / 2;
                let halfZ = obj.sizeZ / 2;
                if (
                    x + playerRadius > obj.x - halfX &&
                    x - playerRadius < obj.x + halfX &&
                    z + playerRadius > obj.z - halfZ &&
                    z - playerRadius < obj.z + halfZ
                ) {
                    return true;
                }
            }
            return false;
        }

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                let speed = 8.0 * delta;
                let dir = new THREE.Vector3();

                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;
                dir.normalize();
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                let nextX = camera.position.x + dir.x * speed;
                let nextZ = camera.position.z + dir.z * speed;

                if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
                camera.position.y = 0; // Fixed eye level height above ground

                // Check Pickups
                interactiveObjects.forEach((obj, index) => {
                    let dist = Math.hypot(camera.position.x - obj.userData.x, camera.position.z - obj.userData.z);
                    if (dist < 1.8) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 500;
                        packagesCollected++;
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `PACKAGES: ${packagesCollected}/${totalPackages}`;
                    }
                });

                // Check Win Condition at Delivery Zone
                let distToExit = Math.hypot(camera.position.x - exitZone.position.x, camera.position.z - exitZone.position.z);
                if (distToExit < 4 && packagesCollected >= totalPackages) {
                    gameWon = true;
                    document.exitPointerLock();
                    document.getElementById("win-screen").style.display = "block";
                }
            }

            interactiveObjects.forEach(obj => {
                obj.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
