<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open World - Cross-Platform GTA Style</title>
    <style>
        body {
            margin: 0;
            background-color: #78b1f5;
            color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 24px;
            border: 2px solid #2563eb;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            color: #1d4ed8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #2563eb;
            font-size: 12px;
            color: #334155;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
            white-space: nowrap;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        /* Mobile Virtual Controls UI */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 15;
            touch-action: none;
            display: none; /* Enabled via script if touch is detected */
        }
        #joystick-handle {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(37, 99, 235, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #22c55e;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            display: none;
            z-index: 25;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        #win-screen h1 { color: #16a34a; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
        #win-screen button:hover { background: #16a34a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">PACKAGES: 0/4</span>
    </div>
    <div id="instructions">PC: Click to look &amp; WASD | Mobile: Use Joystick &amp; Swipe Screen</div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>

    <div id="win-screen">
        <h1>MISSION PASSED!</h1>
        <p>All packages secured across the district!</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            alert('Failed to load Three.js library.');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 300;
        let d = 80;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(800, 800);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Roads
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

        function createRoad(x, z, width, length, rotation = 0) {
            let roadGroup = new THREE.Group();
            let road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            roadGroup.add(road);

            for (let i = -length / 2 + 3; i < length / 2; i += 6) {
                let line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.01;
                if (rotation === 0) line.position.z = i;
                else line.position.x = i;
                roadGroup.add(line);
            }
            roadGroup.position.set(x, -1.18, z);
            roadGroup.rotation.y = rotation;
            scene.add(roadGroup);
        }

        createRoad(0, 0, 14, 300, 0);
        createRoad(0, 0, 300, 14, Math.PI / 2);
        createRoad(0, -90, 14, 300, 0);
        createRoad(-90, 0, 300, 14, Math.PI / 2);

        // Houses & Colliders
        const solidColliders = [];

        function createHouse(x, z, width, height, depth, wallColor, roofColor) {
            let houseGroup = new THREE.Group();
            let walls = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.6 })
            );
            walls.position.y = height / 2 - 1.18;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            let roof = new THREE.Mesh(
                new THREE.ConeGeometry(Math.max(width, depth) * 0.75, 3, 4),
                new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5 })
            );
            roof.position.y = height + 0.35;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            let door = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 2.2, 0.2),
                new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 })
            );
            door.position.set(0, 0, depth / 2 + 0.05);
            houseGroup.add(door);

            houseGroup.position.set(x, 0, z);
            scene.add(houseGroup);
            solidColliders.push({ x: x, z: z, sizeX: width + 0.6, sizeZ: depth + 0.6 });
        }

        const houseColors = [0xf8fafc, 0xf1f5f9, 0xe2e8f0, 0xdcbdab, 0xc27803];
        const roofColors = [0x991b1b, 0x1e3a8a, 0x14532d, 0x334155, 0x78350f];

        for (let xPos of [-55, -25, 25, 55]) {
            for (let zPos of [-55, -25, 25, 55]) {
                let wColor = houseColors[Math.floor(Math.random() * houseColors.length)];
                let rColor = roofColors[Math.floor(Math.random() * roofColors.length)];
                createHouse(xPos, zPos, 12, 7, 12, wColor, rColor);
            }
        }

        // Trees
        function createTree(x, z) {
            let treeGroup = new THREE.Group();
            let trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 })
            );
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            let leaves = new THREE.Mesh(
                new THREE.DodecahedronGeometry(3),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 })
            );
            leaves.position.y = 4.5;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, -1.18, z);
            scene.add(treeGroup);
            solidColliders.push({ x: x, z: z, sizeX: 1.2, sizeZ: 1.2 });
        }

        for (let i = -120; i <= 120; i += 30) {
            if (Math.abs(i) > 15) {
                createTree(i, -18);
                createTree(i, 18);
                createTree(-18, i);
                createTree(18, i);
            }
        }

        // Collectibles
        let score = 0;
        let packagesCollected = 0;
        const totalPackages = 4;
        let gameWon = false;
        const interactiveObjects = [];

        function createPackage(x, z) {
            let pkg = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.2, 1.2),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.2 })
            );
            pkg.position.set(x, -0.5, z);
            pkg.castShadow = true;
            pkg.userData = { type: 'package', x: x, z: z };
            scene.add(pkg);
            interactiveObjects.push(pkg);
        }

        createPackage(-40, -40);
        createPackage(40, -40);
        createPackage(-40, 40);
        createPackage(50, 50);

        let exitZone = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.1, 6),
            new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, roughness: 0.2 })
        );
        exitZone.position.set(0, -1.15, -70);
        scene.add(exitZone);

        camera.position.set(0, 0, 70);

        // Control Inputs State
        let yaw = 0;
        let pitch = 0;
        const playerRadius = 0.5;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        // Desktop Pointer Lock Setup
        renderer.domElement.addEventListener('click', () => {
            if (!('ontouchstart' in window) && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body || gameWon) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        // Keyboard Event Listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        // Mobile Touch & Virtual Joystick Setup
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('instructions').innerText = 'Use left joystick to move & right screen to look';

            let joystickZone = document.getElementById('joystick-zone');
            let joystickHandle = document.getElementById('joystick-handle');
            let touchId = null;
            let centerPos = { x: 0, y: 0 };

            joystickZone.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                let touch = e.changedTouches[0];
                touchId = touch.identifier;
                let rect = joystickZone.getBoundingClientRect();
                centerPos.x = rect.left + rect.width / 2;
                centerPos.y = rect.top + rect.height / 2;
            });

            joystickZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let dx = touch.clientX - centerPos.x;
                        let dy = touch.clientY - centerPos.y;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 40;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickX = dx / maxDist;
                        joystickY = dy / maxDist;
                    }
                }
            });

            let endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        joystickX = 0;
                        joystickY = 0;
                        joystickHandle.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            joystickZone.addEventListener('touchend', endTouch);
            joystickZone.addEventListener('touchcancel', endTouch);

            // Right side screen swipe for camera look on mobile
            let lookTouchId = null;
            let lastX = 0, lastY = 0;

            document.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.clientX > window.innerWidth / 2 && lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastX = touch.clientX;
                        lastY = touch.clientY;
                    }
                }
            });

            document.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) {
                        let movementX = touch.clientX - lastX;
                        let movementY = touch.clientY - lastY;
                        lastX = touch.clientX;
                        lastY = touch.clientY;

                        yaw -= movementX * 0.005;
                        pitch -= movementY * 0.005;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                        camera.rotation.set(pitch, yaw, 0, 'YXZ');
                    }
                }
            });

            let endLookTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            };
            document.addEventListener('touchend', endLookTouch);
            document.addEventListener('touchcancel', endLookTouch);
        }

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let halfX = obj.sizeX / 2;
                let halfZ = obj.sizeZ / 2;
                if (
                    x + playerRadius > obj.x - halfX &&
                    x - playerRadius < obj.x + halfX &&
                    z + playerRadius > obj.z - halfZ &&
                    z - playerRadius < obj.z + halfZ
                ) {
                    return true;
                }
            }
            return false;
        }

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                let speed = 8.0 * delta;
                let dir = new THREE.Vector3();

                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                // Add mobile joystick influence
                if (isTouchDevice) {
                    dir.x += joystickX;
                    dir.z += joystickY;
                }

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    let nextX = camera.position.x + dir.x * speed;
                    let nextZ = camera.position.z + dir.z * speed;

                    if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                    if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
                }
                camera.position.y = 0;

                // Pickups check
                interactiveObjects.forEach((obj, index) => {
                    let dist = Math.hypot(camera.position.x - obj.userData.x, camera.position.z - obj.userData.z);
                    if (dist < 1.8) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 500;
                        packagesCollected++;
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `PACKAGES: ${packagesCollected}/${totalPackages}`;
                    }
                });

                // Win check
                let distToExit = Math.hypot(camera.position.x - exitZone.position.x, camera.position.z - exitZone.position.z);
                if (distToExit < 4 && packagesCollected >= totalPackages) {
                    gameWon = true;
                    if (document.pointerLockElement) document.exitPointerLock();
                    document.getElementById("win-screen").style.display = "block";
                }
            }

            interactiveObjects.forEach(obj => {
                obj.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
