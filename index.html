<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Open World</title>
    <style>
        body {
            margin: 0;
            background-color: #78b1f5;
            color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 24px;
            border: 2px solid #2563eb;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            color: #1d4ed8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #2563eb;
            font-size: 12px;
            color: #334155;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
            white-space: nowrap;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #joystick-zone {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 15;
            touch-action: none;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #joystick-handle {
            position: absolute;
            top: 42px;
            left: 42px;
            width: 50px;
            height: 50px;
            background: rgba(37, 99, 235, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #22c55e;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            display: none;
            z-index: 25;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        #win-screen h1 { color: #16a34a; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4);
        }
        #win-screen button:hover { background: #16a34a; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">RUG VILLE CASH: $0</span>
        <span id="package-text">PACKAGES: 0/4</span>
    </div>
    <div id="instructions">PC: Click to look &amp; WASD | Mobile: Drag Joystick to Move &amp; Turn</div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>

    <div id="win-screen">
        <h1>RUG VILLE SAVED!</h1>
        <p>All items delivered across the bustling city!</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            alert('Failed to load Three.js library.');
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        let d = 100;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x38a169, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Roads
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

        function createRoad(x, z, width, length, rotation = 0) {
            let roadGroup = new THREE.Group();
            let road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            roadGroup.add(road);

            for (let i = -length / 2 + 3; i < length / 2; i += 6) {
                let line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.01;
                if (rotation === 0) line.position.z = i;
                else line.position.x = i;
                roadGroup.add(line);
            }
            roadGroup.position.set(x, -1.18, z);
            roadGroup.rotation.y = rotation;
            scene.add(roadGroup);
        }

        createRoad(0, 0, 16, 400, 0);
        createRoad(0, 0, 400, 16, Math.PI / 2);
        createRoad(0, -120, 16, 400, 0);
        createRoad(-120, 0, 400, 16, Math.PI / 2);

        // Houses & Buildings Colliders
        const solidColliders = [];

        function createBuilding(x, z, width, height, depth, wallColor, roofColor) {
            let group = new THREE.Group();
            let walls = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.6 })
            );
            walls.position.y = height / 2 - 1.18;
            walls.castShadow = true;
            walls.receiveShadow = true;
            group.add(walls);

            let roof = new THREE.Mesh(
                new THREE.BoxGeometry(width + 0.5, 0.8, depth + 0.5),
                new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5 })
            );
            roof.position.y = height - 0.7;
            roof.castShadow = true;
            group.add(roof);

            group.position.set(x, 0, z);
            scene.add(group);
            solidColliders.push({ x: x, z: z, sizeX: width + 0.5, sizeZ: depth + 0.5 });
        }

        const bColors = [0xe2e8f0, 0xcbd5e1, 0x94a3b8, 0xf1f5f9, 0xdcbdab];
        const rColors = [0x334155, 0x1e293b, 0x0f172a, 0x475569];

        for (let xPos of [-70, -35, 35, 70]) {
            for (let zPos of [-70, -35, 35, 70]) {
                createBuilding(xPos, zPos, 14, 9, 14, bColors[Math.floor(Math.random()*bColors.length)], rColors[Math.floor(Math.random()*rColors.length)]);
            }
        }

        // --- VEHICLES (Cars & Buses) ---
        function createCar(x, z, color, isBus = false) {
            let carGroup = new THREE.Group();
            let w = isBus ? 2.4 : 1.8;
            let l = isBus ? 6.5 : 3.8;
            let h = isBus ? 2.6 : 1.4;

            let body = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, l),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.4 })
            );
            body.position.y = h / 2 - 0.7;
            body.castShadow = true;
            carGroup.add(body);

            // Wheels
            let wheelMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.8 });
            let wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12);
            wheelGeo.rotateZ(Math.PI / 2);

            [-w/2 - 0.1, w/2 + 0.1].forEach(wx => {
                [-l/3, l/3].forEach(wz => {
                    let wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.position.set(wx, -0.6, wz);
                    carGroup.add(wheel);
                });
            });

            carGroup.position.set(x, 0, z);
            scene.add(carGroup);
            solidColliders.push({ x: x, z: z, sizeX: w + 0.4, sizeZ: l + 0.4 });
        }

        createCar(-25, 6, 0xdc2626); // Red car parked
        createCar(25, -6, 0x2563eb); // Blue car parked
        createCar(6, 45, 0xf59e0b, true); // Big Yellow Bus parked
        createCar(-6, -45, 0xffffff, true); // White Bus parked

        // --- CITIZENS & WORKERS ---
        function createPerson(x, z, shirtColor, isWorker = false) {
            let personGroup = new THREE.Group();

            let legs = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.8, 0.4),
                new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.9 })
            );
            legs.position.y = -0.8;
            personGroup.add(legs);

            let torso = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.9, 0.4),
                new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.8 })
            );
            torso.position.y = -0.1;
            personGroup.add(torso);

            if (isWorker) {
                let hat = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 0.2, 0.6),
                    new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 }) // Hard hat
                );
                hat.position.y = 0.45;
                personGroup.add(hat);
            }

            let head = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0xf5d0b1, roughness: 0.7 })
            );
            head.position.y = isWorker ? 0.7 : 0.55;
            personGroup.add(head);

            personGroup.position.set(x, 0, z);
            scene.add(personGroup);
        }

        for (let i = 0; i < 15; i++) {
            let px = (Math.random() - 0.5) * 140;
            let pz = (Math.random() - 0.5) * 140;
            let colors = [0xef4444, 0x3b82f6, 0x10b981, 0xa855f7, 0xf97316];
            createPerson(px, pz, colors[Math.floor(Math.random()*colors.length)], Math.random() > 0.5);
        }

        // --- ANIMALS ---
        function createDog(x, z) {
            let dog = new THREE.Group();
            let body = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.4, 0.9),
                new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.8 })
            );
            body.position.y = -0.8;
            dog.add(body);

            let head = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.3, 0.3),
                new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.8 })
            );
            head.position.set(0, -0.6, 0.5);
            dog.add(head);

            dog.position.set(x, 0, z);
            scene.add(dog);
        }

        createDog(-12, 12);
        createDog(15, -20);

        // Trees
        function createTree(x, z) {
            let treeGroup = new THREE.Group();
            let trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 })
            );
            trunk.position.y = 1;
            treeGroup.add(trunk);

            let leaves = new THREE.Mesh(
                new THREE.DodecahedronGeometry(3),
                new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.8 })
            );
            leaves.position.y = 4.5;
            treeGroup.add(leaves);

            treeGroup.position.set(x, -1.18, z);
            scene.add(treeGroup);
            solidColliders.push({ x: x, z: z, sizeX: 1.2, sizeZ: 1.2 });
        }

        for (let i = -140; i <= 140; i += 35) {
            if (Math.abs(i) > 20) {
                createTree(i, -22);
                createTree(i, 22);
                createTree(-22, i);
                createTree(22, i);
            }
        }

        // Collectibles & Packages
        let score = 0;
        let packagesCollected = 0;
        const totalPackages = 4;
        let gameWon = false;
        const interactiveObjects = [];

        function createPackage(x, z) {
            let pkg = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.2, 1.2),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.2 })
            );
            pkg.position.set(x, -0.5, z);
            pkg.castShadow = true;
            pkg.userData = { type: 'package', x: x, z: z };
            scene.add(pkg);
            interactiveObjects.push(pkg);
        }

        createPackage(-50, -50);
        createPackage(50, -50);
        createPackage(-50, 50);
        createPackage(60, 60);

        let exitZone = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.1, 6),
            new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, roughness: 0.2 })
        );
        exitZone.position.set(0, -1.15, -90);
        scene.add(exitZone);

        camera.position.set(0, 0, 80);

        // Controls State
        let yaw = 0;
        let pitch = 0;
        const playerRadius = 0.5;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        renderer.domElement.addEventListener('click', () => {
            if (!('ontouchstart' in window) && document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body || gameWon) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            document.getElementById('instructions').innerText = 'Rug Ville Mobile: Push joystick to move & steer!';

            let joystickZone = document.getElementById('joystick-zone');
            let joystickHandle = document.getElementById('joystick-handle');
            let touchId = null;
            let centerPos = { x: 0, y: 0 };

            joystickZone.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                let touch = e.changedTouches[0];
                touchId = touch.identifier;
                let rect = joystickZone.getBoundingClientRect();
                centerPos.x = rect.left + rect.width / 2;
                centerPos.y = rect.top + rect.height / 2;
            });

            joystickZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let dx = touch.clientX - centerPos.x;
                        let dy = touch.clientY - centerPos.y;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 45;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickX = dx / maxDist;
                        joystickY = dy / maxDist;
                    }
                }
            });

            let endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        joystickX = 0;
                        joystickY = 0;
                        joystickHandle.style.transform = `translate(0px, 0px)`;
                    }
                }
            };
            joystickZone.addEventListener('touchend', endTouch);
            joystickZone.addEventListener('touchcancel', endTouch);
        }

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let halfX = obj.sizeX / 2;
                let halfZ = obj.sizeZ / 2;
                if (
                    x + playerRadius > obj.x - halfX &&
                    x - playerRadius < obj.x + halfX &&
                    z + playerRadius > obj.z - halfZ &&
                    z - playerRadius < obj.z + halfZ
                ) {
                    return true;
                }
            }
            return false;
        }

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                let speed = 8.5 * delta;
                let dir = new THREE.Vector3();

                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                if (isTouchDevice) {
                    if (Math.abs(joystickX) > 0.1) {
                        yaw -= joystickX * 2.2 * delta;
                    }
                    if (Math.abs(joystickY) > 0.1) {
                        dir.z += joystickY;
                    }
                }

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                    let nextX = camera.position.x + dir.x * speed;
                    let nextZ = camera.position.z + dir.z * speed;

                    if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                    if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
                }

                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.y = 0;

                interactiveObjects.forEach((obj, index) => {
                    let dist = Math.hypot(camera.position.x - obj.userData.x, camera.position.z - obj.userData.z);
                    if (dist < 1.8) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 500;
                        packagesCollected++;
                        document.getElementById("score-text").innerText = `RUG VILLE CASH: $${score}`;
                        document.getElementById("package-text").innerText = `PACKAGES: ${packagesCollected}/${totalPackages}`;
                    }
                });

                let distToExit = Math.hypot(camera.position.x - exitZone.position.x, camera.position.z - exitZone.position.z);
                if (distToExit < 4 && packagesCollected >= totalPackages) {
                    gameWon = true;
                    if (document.pointerLockElement) document.exitPointerLock();
                    document.getElementById("win-screen").style.display = "block";
                }
            }

            interactiveObjects.forEach(obj => {
                obj.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
