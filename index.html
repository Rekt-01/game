<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Pixel Street Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #2b1d2c;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: #2b1d2c;
            border: 4px solid #facc15;
            padding: 8px 20px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            color: #facc15;
            box-shadow: 4px 4px 0px #000;
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b1d2c;
            padding: 8px 16px;
            border: 4px solid #facc15;
            font-size: 11px;
            color: #fde047;
            text-align: center;
            pointer-events: none;
            box-shadow: 4px 4px 0px #000;
            z-index: 10;
            white-space: nowrap;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #facc15;
            border: 2px solid #000;
            pointer-events: none;
            z-index: 10;
        }
        .building-sign {
            position: absolute;
            background: #451a03;
            color: #facc15;
            border: 3px solid #facc15;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            box-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2b1d2c;
            border: 6px solid #22c55e;
            padding: 30px;
            text-align: center;
            display: none;
            z-index: 35;
            box-shadow: 8px 8px 0px #000;
            color: #fff;
        }
        #win-screen h1 { color: #22c55e; margin-top: 0; }
        #win-screen button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #22c55e;
            color: white;
            border: 4px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">STORES VISITED: 0/4</span>
    </div>
    <div id="instructions">WASD: Walk down the pixel street | Explore shops</div>
    <div id="speech-overlay"></div>

    <div id="win-screen">
        <h1>STREET EXPLORED!</h1>
        <p>You checked out all the pixel storefronts!</p>
        <button onclick="location.reload()">EXPLORE AGAIN</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8); // Sunny daytime sky

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfffbeb, 1.0);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfef08a, 1.2);
        sunLight.position.set(40, 100, 40);
        scene.add(sunLight);

        // --- PROCEDURAL PIXEL TEXTURES (Bricks, Cobblestone, Awnings) ---
        function createPixelTexture(drawFunction, width = 32, height = 32) {
            let canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            let ctx = canvas.getContext('2d');
            drawFunction(ctx, width, height);
            let texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // Cobblestone Street Texture
        const streetTexture = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#475569';
            for (let y = 0; y < h; y += 4) {
                for (let x = (y/4)%2 === 0 ? 0 : 4; x < w; x += 8) {
                    ctx.fillRect(x, y, 7, 3);
                }
            }
        }, 32, 32);
        streetTexture.repeat.set(40, 40);

        // Red Brick Building Texture
        const brickTexture = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#7f1d1d'; // Deep red brick base
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#450a0a'; // Mortar lines
            for (let y = 0; y < h; y += 8) {
                ctx.fillRect(0, y, w, 2);
                let offset = (y / 8) % 2 === 0 ? 0 : 8;
                for (let x = offset; x < w; x += 16) {
                    ctx.fillRect(x, y, 2, 8);
                }
            }
        }, 32, 32);
        brickTexture.repeat.set(4, 4);

        // Ground/Sidewalk plane
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshBasicMaterial({ map: streetTexture });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.0;
        scene.add(ground);

        // --- STREET BUILDINGS & SHOPS ---
        const solidColliders = [];
        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        function createStorefront(x, z, rotY, storeName, awningColor) {
            let group = new THREE.Group();

            // Main Building Facade
            let facadeMat = new THREE.MeshBasicMaterial({ map: brickTexture });
            let facade = new THREE.Mesh(new THREE.BoxGeometry(16, 14, 12), facadeMat);
            facade.position.y = 6;
            group.add(facade);
            solidColliders.push({ x: x, z: z, sizeX: 16, sizeZ: 12 });

            // Pixel Awning (Store Canopy)
            let awningCanvas = createPixelTexture((ctx, w, h) => {
                ctx.fillStyle = awningColor;
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#fff';
                for (let i = 0; i < w; i += 8) {
                    ctx.fillRect(i, 0, 4, h);
                }
            }, 16, 16);
            
            let awningMat = new THREE.MeshBasicMaterial({ map: awningCanvas });
            let awning = new THREE.Mesh(new THREE.BoxGeometry(16, 1, 6), awningMat);
            awning.position.set(0, 0, 7);
            awning.rotation.x = 0.3;
            group.add(awning);

            group.position.set(x, 0, z);
            group.rotation.y = rotY;
            scene.add(group);

            // Floating Retro Sign
            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = storeName;
            speechOverlay.appendChild(signEl);
            buildingSignsData.push({ mesh: group, signElement: signEl, offsetY: 14.5 });
        }

        // Build a cozy pixel street corridor
        createStorefront(-20, -30, 0, "PIXEL BAKERY", "#f97316");
        createStorefront(20, -30, 0, "GENERAL STORE", "#10b981");
        createStorefront(-20, 30, Math.PI, "COFFEE SHOP", "#eab308");
        createStorefront(20, 30, Math.PI, "ARCADE GAMES", "#ec4899");

        // Collectibles / Shops to visit
        let score = 0;
        let visitedCount = 0;
        let gameWon = false;
        const interactiveObjects = [];

        function createShopCoin(x, z) {
            let coin = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 1.5, 1.5),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            coin.position.set(x, -0.2, z);
            coin.userData = { x: x, z: z };
            scene.add(coin);
            interactiveObjects.push(coin);
        }

        createShopCoin(-20, -15);
        createShopCoin(20, -15);
        createShopCoin(-20, 15);
        createShopCoin(20, 15);

        // Player controls
        let playerPos = new THREE.Vector3(0, 0, 50);
        camera.position.copy(playerPos);
        let yaw = 0, pitch = 0;
        const playerRadius = 0.4;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        renderer.domElement.addEventListener('click', () => {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body || gameWon) return;
            yaw -= e.movementX * 0.003;
            pitch -= e.movementY * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let halfX = obj.sizeX / 2;
                let halfZ = obj.sizeZ / 2;
                if (x + playerRadius > obj.x - halfX && x - playerRadius < obj.x + halfX && z + playerRadius > obj.z - halfZ && z - playerRadius < obj.z + halfZ) {
                    return true;
                }
            }
            return false;
        }

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                let speed = 7.0 * delta;
                let dir = new THREE.Vector3();
                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    let nx = playerPos.x + dir.x * speed;
                    let nz = playerPos.z + dir.z * speed;
                    if (!checkCollision(nx, playerPos.z)) playerPos.x = nx;
                    if (!checkCollision(playerPos.x, nz)) playerPos.z = nz;
                }

                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.copy(playerPos);
                camera.position.y = 0;

                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 40) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else {
                        b.signElement.style.display = 'none';
                    }
                });

                interactiveObjects.forEach((obj, index) => {
                    if (Math.hypot(playerPos.x - obj.userData.x, playerPos.z - obj.userData.z) < 2.0) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 250;
                        visitedCount++;
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `STORES VISITED: ${visitedCount}/4`;
                        if (visitedCount >= 4) {
                            gameWon = true;
                            if (document.pointerLockElement) document.exitPointerLock();
                            document.getElementById("win-screen").style.display = "block";
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
