<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Ultra Detail Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1b4b;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: #0f172a;
            border: 3px solid #facc15;
            padding: 6px 15px;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            color: #facc15;
            box-shadow: 3px 3px 0px #000;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }
        #click-prompt {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #facc15;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 50;
            padding: 20px;
        }
        #click-prompt span {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #facc15;
            border: 2px solid #000;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        #joystick-zone {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 20;
            display: none;
        }
        #joystick-handle {
            position: absolute;
            top: 36px;
            left: 36px;
            width: 48px;
            height: 48px;
            background: #facc15;
            border: 2px solid #000;
            border-radius: 50%;
            pointer-events: none;
        }
        .building-sign {
            position: absolute;
            background: #1e1b4b;
            color: #facc15;
            border: 3px solid #facc15;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            box-shadow: 3px 3px 0px #000;
            text-transform: uppercase;
        }
        .npc-speech {
            position: absolute;
            background: #ffffff;
            color: #0f172a;
            border: 2px solid #000;
            padding: 4px 8px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            display: none;
            box-shadow: 2px 2px 0px #000;
            z-index: 12;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 6px solid #22c55e;
            padding: 30px;
            text-align: center;
            display: none;
            z-index: 35;
            box-shadow: 8px 8px 0px #000;
            color: #fff;
        }
        #win-screen h1 { color: #22c55e; margin-top: 0; }
        #win-screen button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #22c55e;
            color: white;
            border: 4px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="click-prompt">
        ENTER ULTRA RUG VILLE
        <span>[ High-Detail Textures & Joystick Steering ]</span>
    </div>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">CASH: $0</span>
        <span id="package-text">ITEMS: 0/4</span>
    </div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>
    <div id="speech-overlay"></div>

    <div id="win-screen">
        <h1>AVENUE CONQUERED!</h1>
        <p>Maximum alpha achieved!</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0284c7);
        scene.fog = new THREE.FogExp2(0x0284c7, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfef08a, 1.2);
        sunLight.position.set(50, 120, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // --- ULTRA-DETAIL PROCEDURAL PIXEL TEXTURES (128x128) ---
        function createPixelTexture(drawFunction, width = 128, height = 128) {
            let canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            let ctx = canvas.getContext('2d');
            drawFunction(ctx, width, height);
            let texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // Detailed Street Asphalt with markings and grit
        const roadTex = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#1e293b';
            for (let y = 0; y < h; y += 8) {
                for (let x = (y/8)%2 === 0 ? 0 : 8; x < w; x += 16) {
                    ctx.fillRect(x, y, 14, 6);
                }
            }
            // Center yellow divider striping
            ctx.fillStyle = '#facc15';
            ctx.fillRect(w/2 - 4, 0, 8, h);
            ctx.fillStyle = '#334155';
            for (let y = 0; y < h; y += 32) ctx.fillRect(w/2 - 4, y, 8, 16);
        }, 128, 128);
        roadTex.repeat.set(1, 100);

        // Intricate High-Definition Brick Facade
        const brickTex = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#450a0a'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#1a0202'; // Deep mortar lines
            for (let y = 0; y < h; y += 16) {
                ctx.fillRect(0, y, w, 3);
                let offset = (y / 16) % 2 === 0 ? 0 : 16;
                for (let x = offset; x < w; x += 32) {
                    ctx.fillRect(x, y, 3, 16);
                }
            }
            // Multi-toned brick texture detailing
            ctx.fillStyle = '#7f1d1d';
            for (let y = 3; y < h; y += 16) {
                let offset = (y / 16) % 2 === 0 ? 0 : 16;
                for (let x = offset + 3; x < w; x += 32) {
                    ctx.fillRect(x, y, 26, 11);
                }
            }
        }, 128, 128);
        brickTex.repeat.set(4, 4);

        // Store Glass & Neon Interior Glow
        const windowTex = createPixelTexture((ctx, w, h) => {
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#38bdf8'; // neon interior panel
            ctx.fillRect(16, 16, w - 32, h - 32);
            ctx.fillStyle = '#facc15'; // display items inside
            ctx.fillRect(32, 48, w - 64, 16);
        }, 128, 128);

        // --- ENVIRONMENT SETUP ---
        let road = new THREE.Mesh(new THREE.PlaneGeometry(20, 500), new THREE.MeshBasicMaterial({ map: roadTex }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = -0.99;
        road.receiveShadow = true;
        scene.add(road);

        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.8 });
        let leftSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(12, 500), sidewalkMat);
        leftSidewalk.rotation.x = -Math.PI / 2;
        leftSidewalk.position.set(-16, -0.98, 0);
        leftSidewalk.receiveShadow = true;
        scene.add(leftSidewalk);

        let rightSidewalk = new THREE.Mesh(new THREE.PlaneGeometry(12, 500), sidewalkMat);
        rightSidewalk.rotation.x = -Math.PI / 2;
        rightSidewalk.position.set(16, -0.98, 0);
        rightSidewalk.receiveShadow = true;
        scene.add(rightSidewalk);

        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        // Detailed Storefront Blocks with Architectural Trims and Window Inserts
        function createUltraStorefront(x, z, storeName, wallColorHex) {
            let group = new THREE.Group();

            let facade = new THREE.Mesh(
                new THREE.BoxGeometry(16, 20, 14), 
                new THREE.MeshStandardMaterial({ color: wallColorHex, roughness: 0.9 })
            );
            facade.position.y = 9;
            facade.castShadow = true;
            facade.receiveShadow = true;
            group.add(facade);

            let displayWindow = new THREE.Mesh(
                new THREE.BoxGeometry(10, 8, 0.5), 
                new THREE.MeshBasicMaterial({ map: windowTex })
            );
            displayWindow.position.set(0, 4, 7.1);
            group.add(displayWindow);

            let roofTrim = new THREE.Mesh(
                new THREE.BoxGeometry(17.5, 1.5, 15.5), 
                new THREE.MeshStandardMaterial({ color: 0xfacc15 })
            );
            roofTrim.position.y = 19.5;
            group.add(roofTrim);

            group.position.set(x, 0, z);
            scene.add(group);

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = storeName;
            speechOverlay.appendChild(signEl);
            buildingSignsData.push({ mesh: group, signElement: signEl, offsetY: 20.5 });
        }

        for (let z = -150; z <= 150; z += 50) {
            createUltraStorefront(-25, z, "ALPHA CALLS", 0x7f1d1d);
            createUltraStorefront(25, z, "PUMP & DUMP", 0x1e3a8a);
        }

        // --- HIGH-DETAIL WALKING NPCS ---
        const degenSlang = [
            "WAGMI BRO!", "BUY THE DIP!", "TO THE MOON 🚀", 
            "TOTAL RUG PULL...", "DIAMOND HANDS 💎", "SEND IT! 📈", "BULLISH AF"
        ];
        
        const pedestrians = [];
        function createWalkingDegen(x, z, rangeZ) {
            let canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 128;
            let ctx = canvas.getContext('2d');
            // Enhanced multi-pixel character render
            ctx.fillStyle = '#f97316'; ctx.fillRect(16, 8, 32, 32); // Hoodie
            ctx.fillStyle = '#22c55e'; ctx.fillRect(12, 40, 40, 44); // Jacket
            ctx.fillStyle = '#0f172a'; ctx.fillRect(16, 84, 12, 40); ctx.fillRect(36, 84, 12, 40); // Pants

            let texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            
            let sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
            sprite.scale.set(2.6, 5.0, 1);
            sprite.position.set(x, 1.4, z);
            scene.add(sprite);

            let bubble = document.createElement('div');
            bubble.className = 'npc-speech';
            bubble.innerText = degenSlang[Math.floor(Math.random() * degenSlang.length)];
            speechOverlay.appendChild(bubble);

            setInterval(() => {
                bubble.innerText = degenSlang[Math.floor(Math.random() * degenSlang.length)];
            }, 3000 + Math.random() * 3000);

            pedestrians.push({
                sprite: sprite,
                bubble: bubble,
                x: x,
                z: z,
                minZ: z - rangeZ,
                maxZ: z + rangeZ,
                speed: (Math.random() * 3 + 2) * (Math.random() > 0.5 ? 1 : -1)
            });
        }

        createWalkingDegen(-14, -60, 40);
        createWalkingDegen(14, -20, 40);
        createWalkingDegen(-14, 40, 40);
        createWalkingDegen(14, 80, 40);

        // --- COLLECTIBLES ---
        let score = 0, collected = 0, gameWon = false;
        const interactiveObjects = [];

        function spawnItem(x, z) {
            let item = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 1.5, 1.5),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.2, metalness: 0.8 })
            );
            item.position.set(x, -0.2, z);
            item.userData = { x: x, z: z };
            item.castShadow = true;
            scene.add(item);
            interactiveObjects.push(item);
        }

        spawnItem(-14, -40);
        spawnItem(14, -10);
        spawnItem(-14, 30);
        spawnItem(14, 60);

        // --- CONTROLS & CAMERA STATE ---
        let playerPos = new THREE.Vector3(0, 1.6, 110);
        camera.position.copy(playerPos);
        let yaw = 0, pitch = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
        } else {
            document.getElementById('crosshair').style.display = 'block';
        }

        const clickPrompt = document.getElementById("click-prompt");
        clickPrompt.addEventListener('click', () => {
            clickPrompt.style.display = 'none';
        });

        // Desktop Look Support
        let isLooking = false, lastX = 0, lastY = 0;
        window.addEventListener('pointerdown', (e) => {
            if (clickPrompt.style.display !== 'flex' && !isTouchDevice) {
                isLooking = true; lastX = e.clientX; lastY = e.clientY;
            }
        });
        window.addEventListener('pointerup', () => { isLooking = false; });
        window.addEventListener('pointermove', (e) => {
            if (gameWon || !isLooking || isTouchDevice) return;
            yaw -= (e.clientX - lastX) * 0.003;
            pitch -= (e.clientY - lastY) * 0.003;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            lastX = e.clientX; lastY = e.clientY;
        });

        // Joystick Controls (Horizontal turns screen, Vertical walks)
        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let touchId = null, centerPos = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            if (touchId !== null) return;
            let touch = e.changedTouches[0];
            touchId = touch.identifier;
            let rect = joystickZone.getBoundingClientRect();
            centerPos.x = rect.left + rect.width / 2;
            centerPos.y = rect.top + rect.height / 2;
        });

        joystickZone.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === touchId) {
                    let dx = touch.clientX - centerPos.x;
                    let dy = touch.clientY - centerPos.y;
                    let dist = Math.hypot(dx, dy), maxDist = 40;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                    joystickX = dx / maxDist;
                    joystickY = dy / maxDist;
                }
            }
        });

        joystickZone.addEventListener('touchend', () => {
            touchId = null; joystickX = 0; joystickY = 0;
            joystickHandle.style.transform = `translate(0px, 0px)`;
        });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (!gameWon) {
                if (Math.abs(joystickX) > 0.1) {
                    yaw -= joystickX * 2.2 * delta;
                }

                let speed = 9.0 * delta;
                let dir = new THREE.Vector3();
                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                if (Math.abs(joystickY) > 0.1) dir.z += joystickY;

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    playerPos.x += dir.x * speed;
                    playerPos.z += dir.z * speed;
                }

                playerPos.x = Math.max(-14, Math.min(14, playerPos.x));
                playerPos.y = 1.6;

                camera.rotation.set(pitch, yaw, 0, 'YXZ');
                camera.position.copy(playerPos);

                pedestrians.forEach(npc => {
                    npc.z += npc.speed * delta;
                    if (npc.z > npc.maxZ || npc.z < npc.minZ) npc.speed *= -1;
                    npc.sprite.position.z = npc.z;

                    let vector = new THREE.Vector3(npc.x, 2.6, npc.z).project(camera);
                    let dist = camera.position.distanceTo(npc.sprite.position);
                    if (vector.z < 1 && dist < 45) {
                        npc.bubble.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        npc.bubble.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        npc.bubble.style.display = 'block';
                    } else {
                        npc.bubble.style.display = 'none';
                    }
                });

                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 65) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else {
                        b.signElement.style.display = 'none';
                    }
                });

                interactiveObjects.forEach((obj, index) => {
                    if (Math.hypot(playerPos.x - obj.userData.x, playerPos.z - obj.userData.z) < 1.5) {
                        scene.remove(obj);
                        interactiveObjects.splice(index, 1);
                        score += 250;
                        collected++;
                        document.getElementById("score-text").innerText = `CASH: $${score}`;
                        document.getElementById("package-text").innerText = `ITEMS: ${collected}/4`;
                        if (collected >= 4) {
                            gameWon = true;
                            document.getElementById("win-screen").style.display = "block";
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
