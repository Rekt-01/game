<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Cyber Degen Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 24px;
            border: 1px solid #00ffff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            z-index: 10;
            pointer-events: none;
            text-transform: uppercase;
            border-radius: 8px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            color: #a5b4fc;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            border-radius: 6px;
        }
        #alert-banner {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            color: #fff;
            padding: 8px 20px;
            border: 1px solid #ef4444;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 2px;
            display: none;
            z-index: 15;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        #action-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            padding: 12px 28px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: none;
            z-index: 20;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: transform 0.1s ease;
        }
        #action-btn:hover { transform: scale(1.05); }
        
        #cockpit-dash {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 180px;
            pointer-events: none; display: none; z-index: 25;
            background: linear-gradient(to top, rgba(5,5,10,0.95) 70%, transparent 100%);
            border-top: 2px solid #00ffff;
        }
        .dashboard-podium {
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 550px; height: 150px;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 20px 10px 20px;
        }
        .gauge-cluster {
            background: rgba(0,0,0,0.8); border: 1px solid #00ffff;
            padding: 8px 14px; text-align: center; color: #00ffff; font-size: 10px; border-radius: 6px;
        }
        .gauge-val { font-size: 20px; color: #fff; margin-top: 2px; font-weight: bold; }
        
        #steering-wheel {
            width: 180px; height: 110px;
            border: 12px solid #0e7490; border-bottom: none;
            border-radius: 90px 90px 0 0; position: relative;
            transition: transform 0.05s linear; transform-origin: bottom center;
        }
        .radio-panel {
            background: rgba(0,0,0,0.8); border: 1px solid #f59e0b;
            padding: 6px 10px; text-align: center; pointer-events: auto;
            cursor: pointer; color: #f59e0b; font-size: 10px; border-radius: 6px;
        }
        .radio-panel:hover { background: rgba(245, 158, 11, 0.1); }

        #garage-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95); border: 2px solid #f59e0b;
            padding: 30px; text-align: center; display: none; z-index: 30;
            color: #fff; border-radius: 12px; box-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
        }
        #garage-modal h2 { color: #f59e0b; margin-top: 0; }
        .upgrade-btn {
            margin: 8px; padding: 10px 20px; background: rgba(0,0,0,0.6);
            color: #f59e0b; border: 1px solid #f59e0b; font-weight: bold; cursor: pointer; border-radius: 6px;
        }
        .upgrade-btn:hover { background: #f59e0b; color: #000; }

        #speech-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; overflow: hidden; }
        .speech-bubble {
            position: absolute; background: rgba(0,0,0,0.85); border: 1px solid #00ffff;
            padding: 4px 10px; font-size: 11px; color: #00ffff;
            white-space: nowrap; transform: translate(-50%, -100%); display: none; border-radius: 4px;
        }
        .building-sign {
            position: absolute; background: rgba(0,0,0,0.85); color: #f59e0b;
            border: 1px solid #f59e0b; padding: 4px 8px; font-size: 10px;
            font-weight: bold; white-space: nowrap; transform: translate(-50%, -100%); display: none; border-radius: 4px;
        }
        #joystick-zone {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 120px; background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff; border-radius: 50%; z-index: 15; touch-action: none; display: none;
        }
        #joystick-handle {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #00ffff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px #00ffff;
        }
        #win-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95); border: 2px solid #00ffff; padding: 40px; text-align: center;
            display: none; z-index: 35; color: #00ffff; border-radius: 12px; box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
        }
        #win-screen button {
            margin-top: 15px; padding: 10px 25px; background: #00ffff; color: #000;
            border: none; font-weight: bold; cursor: pointer; border-radius: 6px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="ui">
        <span id="score-text">VAULT: $0</span>
        <span id="package-text">CHIPS: 0/4</span>
    </div>
    <button id="action-btn" onclick="handleActionClick()">ACQUIRE VEHICLE</button>
    <div id="alert-banner">⚠️ WHALE ALERT: SECURITY PROTOCOL ENGAGED ⚠️</div>
    <div id="speech-overlay"></div>
    
    <div id="cockpit-dash">
        <div class="dashboard-podium">
            <div class="gauge-cluster">
                VELOCITY
                <div id="dash-speed" class="gauge-val">0</div>
            </div>
            <div id="steering-container">
                <div id="steering-wheel"></div>
            </div>
            <div class="radio-panel" onclick="toggleRadio()">
                CYBER BEATS<br>
                <span id="radio-status" style="color: #fff;">[ MUTED ]</span>
            </div>
        </div>
    </div>

    <div id="garage-modal">
        <h2>DEGEN GARAGE</h2>
        <p>Upgrade your ride with liquid capital:</p>
        <button class="upgrade-btn" onclick="upgradeCar('speed')">Nitro Overclock ($500)</button><br>
        <button class="upgrade-btn" onclick="upgradeCar('handling')">Cyber Grip ($400)</button><br>
        <button class="upgrade-btn" onclick="upgradeCar('paint')">Neon RGB Wrap ($300)</button><br>
        <button class="upgrade-btn" style="border-color:#ef4444; color:#ef4444;" onclick="closeGarage()">Exit Garage</button>
    </div>

    <div id="instructions">WASD / Arrow Keys: Move & Drive | Approach Vehicle or Garage | E: Interact</div>
    
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>

    <div id="win-screen">
        <h2>TO THE MOON 🚀</h2>
        <p>All protocol assets secured successfully.</p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a16);
        scene.fog = new THREE.FogExp2(0x0a0a16, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Crisp, high-end WebGL settings (No more pixelated look)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0x00ffff, 1.5);
        sunLight.position.set(50, 150, 50);
        scene.add(sunLight);

        const neonLight = new THREE.DirectionalLight(0xff00ff, 1.0);
        neonLight.position.set(-50, 100, -50);
        scene.add(neonLight);

        // Modern Cyber Grid Floor
        const gridHelper = new THREE.GridHelper(800, 80, 0x00ffff, 0x1e1e3f);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        const solidColliders = [];
        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.2, metalness: 0.8 });

        function createRoad(x, z, w, l, rot = 0) {
            let group = new THREE.Group();
            let road = new THREE.Mesh(new THREE.PlaneGeometry(w, l), roadMat);
            road.rotation.x = -Math.PI / 2;
            group.add(road);
            group.position.set(x, -1.18, z);
            group.rotation.y = rot;
            scene.add(group);
        }

        const mapSize = 120;
        createRoad(0, -mapSize, 18, mapSize * 2, 0);
        createRoad(0, mapSize, 18, mapSize * 2, 0);
        createRoad(-mapSize, 0, 18, mapSize * 2, Math.PI / 2);
        createRoad(mapSize, 0, 18, mapSize * 2, Math.PI / 2);

        function createCyberBuilding(x, z, sx, sz, h, color, signText, isGarage = false) {
            let mesh = new THREE.Mesh(
                new THREE.BoxGeometry(sx, h, sz),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.7 })
            );
            mesh.position.set(x, h/2 - 1.19, z);
            scene.add(mesh);
            solidColliders.push({ x: x, z: z, sizeX: sx, sizeZ: sz, isGarage: isGarage });

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = signText;
            speechOverlay.appendChild(signEl);
            buildingSignsData.push({ mesh: mesh, signElement: signEl, offsetY: h + 0.6 });
        }

        createCyberBuilding(-60, -60, 14, 14, 16, 0x1e1b4b, "LIQUIDITY POOL A");
        createCyberBuilding(60, -60, 16, 16, 20, 0x0f172a, "NODE STAKING");
        createCyberBuilding(-60, 60, 16, 14, 14, 172554, "GOVERNANCE");
        createCyberBuilding(0, -100, 16, 12, 10, 0x78350f, "DEGEN GARAGE", true);

        // Load Custom User .glb Model & Handle Animation Mixer
        const gltfLoader = new THREE.GLTFLoader();
        let customCharacter = null;
        let mixer = null;
        let idleAction = null, walkAction = null, activeAction = null;

        gltfLoader.load(
            './9aeae37947f49e83f8cb3513c9a23826.glb',
            function (gltf) {
                customCharacter = gltf.scene;
                customCharacter.scale.set(1, 1, 1);
                customCharacter.position.set(0, -1.2, 40);
                scene.add(customCharacter);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(customCharacter);
                    
                    // Assign animations safely (Index 0 usually idle, Index 1/next usually walk/run if available)
                    idleAction = mixer.clipAction(gltf.animations[0]);
                    idleAction.play();
                    activeAction = idleAction;

                    if (gltf.animations.length > 1) {
                        walkAction = mixer.clipAction(gltf.animations[1]);
                    } else {
                        walkAction = idleAction; // Fallback if only 1 animation exists
                    }
                }
                console.log("Custom GLB Character loaded with animations!");
            },
            undefined,
            function (error) {
                console.error('Error loading custom GLB file:', error);
            }
        );

        const drivableVehicles = [];
        let currentVehicle = null;

        function createCyberCar(x, z, color) {
            let carGroup = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 4), new THREE.MeshStandardMaterial({ color: color, metalness: 0.9, roughness: 0.1 }));
            body.position.y = -0.6;
            carGroup.add(body);

            let roof = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.5, roughness: 0.2 }));
            roof.position.set(0, -0.1, -0.2);
            carGroup.add(roof);

            carGroup.position.set(x, 0, z);
            scene.add(carGroup);

            let carObj = {
                mesh: carGroup, bodyMesh: body, x: x, z: z, rotationY: 0, speed: 0,
                maxSpeedMultiplier: 1.0, handlingMultiplier: 1.0
            };
            drivableVehicles.push(carObj);
            return carObj;
        }

        createCyberCar(-20, -40, 0xff00ff);

        const activeCitizens = [];
        const degenQuotes = ["WAGMI!", "Pump it!", "Buy the dip!", "Rug pulled!"];

        function createNPC(x, z, isGuarding = true) {
            let group = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: isGuarding ? 0xef4444 : 0x00ffff, roughness: 0.4 }));
            body.position.y = -0.3;
            group.add(body);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshStandardMaterial({ color: 0xfff }));
            head.position.y = 0.4;
            group.add(head);

            group.position.set(x, 0, z);
            scene.add(group);

            let bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            bubble.innerText = isGuarding ? "Whale: Stay out!" : degenQuotes[Math.floor(Math.random() * degenQuotes.length)];
            speechOverlay.appendChild(bubble);

            activeCitizens.push({ mesh: group, x: x, z: z, originX: x, originZ: z, angle: Math.random() * 6, bubble: bubble });
        }

        for(let i=0; i<5; i++) createNPC((Math.random()-0.5)*90, (Math.random()-0.5)*90, false);
        createNPC(15, -90, true);

        let score = 0;
        let packagesCollected = 0;
        const totalPackages = 4;
        let gameWon = false;
        const interactiveObjects = [];

        function createChip(x, z) {
            let obj = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 }));
            obj.position.set(x, -0.8, z);
            obj.userData = { x: x, z: z };
            scene.add(obj);
            interactiveObjects.push(obj);
        }

        createChip(-45, -45); createChip(45, -45);
        createChip(-45, 45); createChip(45, 45);

        let exitZone = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x22c55e, emissiveIntensity: 0.8 }));
        exitZone.position.set(0, -1.15, -110);
        scene.add(exitZone);

        let playerPos = new THREE.Vector3(0, 0, 50);
        let yaw = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joystickX = 0, joystickY = 0;
        let nearbyCar = null, nearGarage = false;

        let audioCtx = null, radioPlaying = false, musicInterval = null;
        function toggleRadio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            radioPlaying = !radioPlaying;
            let statusEl = document.getElementById("radio-status");
            if (radioPlaying) {
                statusEl.innerText = "[ PLAYING ]";
                statusEl.style.color = "#00ffff";
                musicInterval = setInterval(() => {
                    if (!radioPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = [220, 247, 261, 293, 329][Math.floor(Math.random()*5)];
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }, 250);
            } else {
                statusEl.innerText = "[ MUTED ]";
                statusEl.style.color = "#fff";
                if (musicInterval) clearInterval(musicInterval);
            }
        }

        function handleActionClick() {
            if (nearGarage) {
                document.getElementById("garage-modal").style.display = "block";
            } else if (!currentVehicle && nearbyCar) {
                currentVehicle = nearbyCar;
                document.getElementById("action-btn").innerText = "EXIT VEHICLE";
                document.getElementById("package-text").innerText = `CHIPS: ${packagesCollected}/${totalPackages} | DRIVING`;
                document.getElementById("cockpit-dash").style.display = "block";
                if (customCharacter) customCharacter.visible = false;
            } else if (currentVehicle) {
                playerPos.copy(currentVehicle.mesh.position); playerPos.x += 2;
                currentVehicle = null;
                document.getElementById("action-btn").style.display = "none";
                document.getElementById("action-btn").innerText = "ACQUIRE VEHICLE";
                document.getElementById("package-text").innerText = `CHIPS: ${packagesCollected}/${totalPackages} | ON FOOT`;
                document.getElementById("cockpit-dash").style.display = "none";
                if (customCharacter) {
                    customCharacter.position.copy(playerPos);
                    customCharacter.position.y = -1.2;
                    customCharacter.visible = true;
                }
                if (radioPlaying) toggleRadio();
            }
        }

        function upgradeCar(type) {
            if (!currentVehicle) return;
            if (type === 'speed' && score >= 500) { score -= 500; currentVehicle.maxSpeedMultiplier += 0.3; }
            else if (type === 'handling' && score >= 400) { score -= 400; currentVehicle.handlingMultiplier += 0.4; }
            else if (type === 'paint' && score >= 300) { score -= 300; currentVehicle.bodyMesh.material.color.setHex(Math.random()*0xffffff); }
            document.getElementById("score-text").innerText = `VAULT: $${score}`;
        }
        function closeGarage() { document.getElementById("garage-modal").style.display = "none"; }

        document.addEventListener('mousemove', (e) => {
            if (gameWon || currentVehicle) return;
            yaw -= e.movementX * 0.003;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            if (e.code === 'KeyE') handleActionClick();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            let joystickZone = document.getElementById('joystick-zone');
            let joystickHandle = document.getElementById('joystick-handle');
            let touchId = null, centerPos = { x: 0, y: 0 };

            joystickZone.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                let touch = e.changedTouches[0]; touchId = touch.identifier;
                let rect = joystickZone.getBoundingClientRect();
                centerPos.x = rect.left + rect.width / 2; centerPos.y = rect.top + rect.height / 2;
            });
            joystickZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === touchId) {
                        let dx = touch.clientX - centerPos.x; let dy = touch.clientY - centerPos.y;
                        let dist = Math.hypot(dx, dy), maxDist = 40;
                        if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
                        joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystickX = dx / maxDist; joystickY = dy / maxDist;
                    }
                }
            });
            joystickZone.addEventListener('touchend', () => {
                touchId = null; joystickX = 0; joystickY = 0;
                joystickHandle.style.transform = `translate(0px, 0px)`;
            });
        }

        function checkCollision(x, z) {
            for (let obj of solidColliders) {
                let hx = obj.sizeX / 2, hz = obj.sizeZ / 2;
                if (x + 0.5 > obj.x - hx && x - 0.5 < obj.x + hx && z + 0.5 > obj.z - hz && z - 0.5 < obj.z + hz) {
                    return obj.isGarage;
                }
            }
            return false;
        }

        let prevTime = performance.now();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            let clockDelta = clock.getDelta();
            if (mixer) mixer.update(clockDelta);

            if (!gameWon) {
                if (!currentVehicle) {
                    let speed = 10.0 * delta;
                    let dir = new THREE.Vector3();
                    if (moveForward) dir.z -= 1;
                    if (moveBackward) dir.z += 1;
                    if (moveLeft) dir.x -= 1;
                    if (moveRight) dir.x += 1;

                    if (isTouchDevice) {
                        if (Math.abs(joystickX) > 0.1) yaw -= joystickX * 2 * delta;
                        if (Math.abs(joystickY) > 0.1) dir.z += joystickY;
                    }

                    let isMoving = (dir.lengthSq() > 0);

                    // Update Animation State (Idle vs Walk)
                    if (walkAction && idleAction && activeAction) {
                        let targetAction = isMoving ? walkAction : idleAction;
                        if (targetAction !== activeAction) {
                            activeAction.fadeOut(0.2);
                            targetAction.reset().fadeIn(0.2).play();
                            activeAction = targetAction;
                        }
                    }

                    if (isMoving) {
                        dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                        let nx = playerPos.x + dir.x * speed;
                        let nz = playerPos.z + dir.z * speed;
                        let cx = checkCollision(nx, playerPos.z);
                        let cz = checkCollision(playerPos.x, nz);
                        if (cx === true) nearGarage = true; else if (!cx) playerPos.x = nx;
                        if (cz === true) nearGarage = true; else if (!cz) playerPos.z = nz;
                    }

                    // Smooth Third-Person Camera Tracking
                    let cameraOffset = new THREE.Vector3(0, 3.5, 7).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    camera.position.copy(playerPos).add(cameraOffset);
                    let lookTarget = playerPos.clone().add(new THREE.Vector3(0, 1, 0));
                    camera.lookAt(lookTarget);

                    if (customCharacter) {
                        customCharacter.position.set(playerPos.x, -1.2, playerPos.z);
                        if (isMoving) {
                            let moveAngle = Math.atan2(dir.x, dir.z);
                            customCharacter.rotation.y = moveAngle;
                        }
                        customCharacter.visible = true;
                    }

                    nearbyCar = null;
                    for (let car of drivableVehicles) {
                        if (playerPos.distanceTo(car.mesh.position) < 5.0) { nearbyCar = car; break; }
                    }

                    let btn = document.getElementById("action-btn");
                    if (nearbyCar || nearGarage) {
                        btn.style.display = "block";
                        btn.innerText = nearGarage ? "ENTER GARAGE" : "ACQUIRE VEHICLE";
                    } else {
                        btn.style.display = "none";
                    }
                } else {
                    let maxSpeed = 35 * currentVehicle.maxSpeedMultiplier;
                    if (moveForward || joystickY < -0.1) currentVehicle.speed += 15 * delta;
                    else if (moveBackward || joystickY > 0.1) currentVehicle.speed -= 15 * delta;
                    else currentVehicle.speed *= 0.94;

                    currentVehicle.speed = Math.max(-12, Math.min(maxSpeed, currentVehicle.speed));

                    let turnInput = 0;
                    if (moveLeft || joystickX < -0.1) turnInput = 1;
                    if (moveRight || joystickX > 0.1) turnInput = -1;

                    currentVehicle.rotationY += (3.0 * currentVehicle.handlingMultiplier) * delta * turnInput * Math.sign(currentVehicle.speed || 1);

                    let moveDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentVehicle.rotationY);
                    currentVehicle.x += moveDir.x * currentVehicle.speed * delta;
                    currentVehicle.z += moveDir.z * currentVehicle.speed * delta;

                    currentVehicle.mesh.position.set(currentVehicle.x, 0, currentVehicle.z);
                    currentVehicle.mesh.rotation.y = currentVehicle.rotationY;

                    let cockpitPos = currentVehicle.mesh.position.clone().add(new THREE.Vector3(0, 0.4, 0));
                    camera.position.copy(cockpitPos);
                    let target = cockpitPos.clone().add(new THREE.Vector3(0, 0, -10).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentVehicle.rotationY));
                    camera.lookAt(target);
                    playerPos.copy(currentVehicle.mesh.position);

                    document.getElementById("dash-speed").innerText = Math.round(Math.abs(currentVehicle.speed) * 3.6);
                    let wheel = document.getElementById("steering-wheel");
                    if(wheel) wheel.style.transform = `rotate(${-turnInput * 35}deg)`;

                    if (Math.abs(currentVehicle.speed) > 25) {
                        document.getElementById("alert-banner").style.display = "block";
                    }
                }

                activeCitizens.forEach(c => {
                    c.angle += delta * 0.8;
                    c.x = c.originX + Math.sin(c.angle) * 6;
                    c.z = c.originZ + Math.cos(c.angle) * 6;
                    c.mesh.position.set(c.x, 0, c.z);

                    let vector = new THREE.Vector3(c.x, 1, c.z).project(camera);
                    let dist = camera.position.distanceTo(c.mesh.position);
                    if (vector.z < 1 && dist < 35) {
                        c.bubble.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        c.bubble.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        c.bubble.style.display = 'block';
                    } else { c.bubble.style.display = 'none'; }
                });

                buildingSignsData.forEach(b => {
                    let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z).project(camera);
                    let dist = camera.position.distanceTo(b.mesh.position);
                    if (vector.z < 1 && dist < 70) {
                        b.signElement.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                        b.signElement.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                        b.signElement.style.display = 'block';
                    } else { b.signElement.style.display = 'none'; }
                });

                interactiveObjects.forEach((obj, index) => {
                    if (Math.hypot(playerPos.x - obj.userData.x, playerPos.z - obj.userData.z) < 2.5) {
                        scene.remove(obj); interactiveObjects.splice(index, 1);
                        score += 500; packagesCollected++;
                        let modeStr = currentVehicle ? "DRIVING" : "ON FOOT";
                        document.getElementById("score-text").innerText = `VAULT: $${score}`;
                        document.getElementById("package-text").innerText = `CHIPS: ${packagesCollected}/${totalPackages} | ${modeStr}`;
                    }
                });

                if (Math.hypot(playerPos.x - exitZone.position.x, playerPos.z - exitZone.position.z) < 4 && packagesCollected >= totalPackages) {
                    gameWon = true;
                    document.getElementById("win-screen").style.display = "block";
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
