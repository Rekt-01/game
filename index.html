<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rug Ville - Bloom & Post-Processing Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14;
            color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border: 2px solid #38bdf8;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            font-size: 12px;
            color: #e2e8f0;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            white-space: nowrap;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #speech-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
            overflow: hidden;
        }
        .speech-bubble {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(4px);
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #f8fafc;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
        }
        .building-sign {
            position: absolute;
            background: #0f172a;
            color: #facc15;
            border: 2px solid #facc15;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.8); /* Glow effect */
            white-space: nowrap;
            transform: translate(-50%, -100%);
            display: none;
            text-transform: uppercase;
        }
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #22c55e;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            display: none;
            z-index: 25;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            color: #fff;
        }
        #win-screen h1 { color: #22c55e; margin-top: 0; }
        #win-screen button {
            margin-top: 20px;
            padding: 12px 30px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <span id="score-text">RUG VILLE CASH: $0</span>
        <span id="package-text">PACKAGES: 0/4</span>
    </div>
    <div id="speech-overlay"></div>
    <div id="instructions">Click to look &amp; WASD to move</div>

    <div id="win-screen">
        <h1>RUG VILLE SAVED!</h1>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING & BLOOM SETUP ---
        const composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.65,  // Bloom Strength (Makes emissive materials glow)
            0.4,   // Radius
            0.8    // Threshold
        );
        composer.addPass(bloomPass);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffedd5, 1.5);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Ground Plane
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Basic Building with Glowing Emissive Windows
        const solidColliders = [];
        const buildingSignsData = [];
        const speechOverlay = document.getElementById('speech-overlay');

        function createBuilding(x, z, width, height, depth, signText) {
            let group = new THREE.Group();
            let walls = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 })
            );
            walls.position.y = height / 2 - 1.18;
            walls.castShadow = true;
            walls.receiveShadow = true;
            group.add(walls);

            // Emissive window layer that catches the Bloom effect
            let glowWindow = new THREE.Mesh(
                new THREE.BoxGeometry(width + 0.1, height * 0.6, depth + 0.1),
                new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.6, roughness: 0.2 })
            );
            glowWindow.position.y = height / 2 - 1.18;
            group.add(glowWindow);

            group.position.set(x, 0, z);
            scene.add(group);
            solidColliders.push({ x: x, z: z, sizeX: width + 0.6, sizeZ: depth + 0.6 });

            let signEl = document.createElement('div');
            signEl.className = 'building-sign';
            signEl.innerText = signText;
            speechOverlay.appendChild(signEl);

            buildingSignsData.push({ mesh: group, signElement: signEl, offsetY: height + 0.8 });
        }

        createBuilding(-35, -35, 14, 11, 14, "Rug Casino");
        createBuilding(35, -35, 14, 11, 14, "Scam Exchange");

        // Player Controls state
        let yaw = 0, pitch = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        renderer.domElement.addEventListener('click', () => {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            camera.rotation.set(pitch, yaw, 0, 'YXZ');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        camera.position.set(0, 0, 40);
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            let time = performance.now();
            let delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            let speed = 8.5 * delta;
            let dir = new THREE.Vector3();
            if (moveForward) dir.z -= 1;
            if (moveBackward) dir.z += 1;
            if (moveLeft) dir.x -= 1;
            if (moveRight) dir.x += 1;

            if (dir.lengthSq() > 0) {
                dir.normalize();
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.x += dir.x * speed;
                camera.position.z += dir.z * speed;
            }
            camera.position.y = 0;

            // Project building sign markers to DOM overlay
            buildingSignsData.forEach(b => {
                let vector = new THREE.Vector3(b.mesh.position.x, b.offsetY, b.mesh.position.z);
                vector.project(camera);
                let distance = camera.position.distanceTo(b.mesh.position);
                if (vector.z < 1 && distance < 60) {
                    let xCoord = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    let yCoord = (-(vector.y * 0.5) + 0.5) * window.innerHeight;
                    b.signElement.style.left = `${xCoord}px`;
                    b.signElement.style.top = `${yCoord}px`;
                    b.signElement.style.display = 'block';
                } else {
                    b.signElement.style.display = 'none';
                }
            });

            // Render through Post-Processing Composer instead of standard renderer
            composer.render();
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
