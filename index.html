<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond Rush - Classic Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        
        <div id="controls">
            <div class="control-row">
                <button class="ctrl-btn" id="btn-up">⬆️</button>
            </div>
            <div class="control-row middle-row">
                <button class="ctrl-btn" id="btn-left">⬅️</button>
                <button class="ctrl-btn action-btn" id="btn-action">Whip</button>
                <button class="ctrl-btn" id="btn-right">➡️</button>
            </div>
            <div class="control-row">
                <button class="ctrl-btn" id="btn-down">⬇️</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
